# DocForge — GPU acceleration override (Docker Compose v2).
#
# LAYER THIS LAST — always combine with the base file and (optionally) the dev override:
#
#   Prod  + GPU:          docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#   Dev   + GPU + reload: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.gpu.yml up -d --build
#
# CPU stays the default in docker-compose.yml and docker-compose.dev.yml.
# This file is strictly opt-in — the repo builds and runs on a CPU-only host without it.
#
# Prerequisites:
#   1. NVIDIA Container Toolkit installed on the Docker host (validates with `nvidia-smi` inside
#      any container started with the runtime).  On Windows + Docker Desktop this means the
#      NVIDIA drivers for WSL2 are present and `docker run --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04
#      nvidia-smi` succeeds.
#   2. The GPU images must be built before the first `up`:
#        docker compose -f docker-compose.yml -f docker-compose.gpu.yml build bge_server worker
#      Build time: ~15-20 min on first run (pulls ~9.5 GB torch + nvidia-cu12-* wheels per image).
#      Subsequent builds are fast (uv cache layer is reused).
#   3. BGE_DEVICE must resolve to "cuda".  Set BGE_DEVICE=auto (or BGE_DEVICE=cuda) in
#      services/bge_server/.env — auto resolves to "cuda" when CUDA is available inside
#      the container and falls back to "cpu" gracefully if not.
#   4. DOCLING_USE_GPU=true is passed to the worker via the environment block below; the
#      Docling backend reads it to enable GPU-accelerated PDF/layout parsing.
#
# Services NOT covered here (no local model, GPU has no benefit):
#   docforge (FastAPI) — embed/rerank are HTTP calls to bge_server, not in-process
#   postgres, redis, qdrant, seaweedfs, gotenberg, pgadmin, mcp — pure CPU workloads

services:

  # ── BGE model-suite — GPU variant ────────────────────────────────────────────
  # Overrides the base image, resource limits, and GPU reservation for the BGE
  # embed + rerank service.  The CPU memory limit is reduced because tensor storage
  # moves to GPU VRAM; only the Python process + tokenizers + HTTP layer stay in RAM.
  bge_server:
    build:
      context: src
      dockerfile: bge_server/Dockerfile
      args:
        # TORCH_VARIANT=gpu installs torch 2.6.0+cu124 (~2 GB wheel) and the full
        # nvidia-cu12-* runtime library set.  The resulting image is ~9.5 GB.
        # The base docker-compose.yml defaults to TORCH_VARIANT=cpu (~2 GB image).
        TORCH_VARIANT: gpu
    # Tag the GPU image distinctly so it coexists with the CPU image on the same host.
    # Pull with: docker compose -f docker-compose.yml -f docker-compose.gpu.yml pull bge_server
    # (or build as above).
    image: docforge-bge-server:gpu
    deploy:
      resources:
        limits:
          # Both BGE models (~4.4 GiB total weights) move to GPU VRAM.
          # The process itself needs only ~1-2 GiB of CPU RAM for tokenizers + HTTP overhead.
          cpus: "4"
          memory: 3g
        reservations:
          devices:
            # Expose all host GPU devices to this container via the NVIDIA Container Toolkit.
            # driver: nvidia — requires the toolkit; compose fails fast if the runtime is absent.
            # count: all    — expose every GPU; adjust to count: 1 on a multi-GPU host.
            # capabilities: [gpu] — enables CUDA compute (the minimum required capability set).
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── arq pipeline worker — GPU variant ─────────────────────────────────────────
  # Docling (the heavy PDF/layout parser) can offload computation to the GPU.
  # The base image uses CPU torch (default, works everywhere); this override rebuilds
  # with TORCH_VARIANT=gpu to install CUDA torch + nvidia-cu12-* runtime libs.
  worker:
    build:
      context: src
      dockerfile: docforge/worker/Dockerfile
      args:
        # TORCH_VARIANT=gpu installs CUDA-capable torch wheels inside the worker image,
        # enabling GPU-accelerated Docling parsing (layout models, table detection, OCR).
        # The base docker-compose.yml defaults to TORCH_VARIANT=cpu.
        TORCH_VARIANT: gpu
    # Tag the GPU variant so it coexists with the CPU worker image on the same host.
    image: docforge-worker:gpu
    environment:
      # Instruct the local providers to use the GPU device for their models.
      # Each local provider backend reads its own deployment flag to select the CUDA device
      # instead of defaulting to CPU-only inference:
      #   - DOCLING_USE_GPU : Docling parser (layout/table torch models)
      #   - PADDLE_USE_GPU  : PaddleOCR detection + recognition
      #   - VIT_USE_GPU     : ViT-ONNX figure classifier (ONNX Runtime CUDA provider)
      - DOCLING_USE_GPU=true
      - PADDLE_USE_GPU=true
      - VIT_USE_GPU=true
    deploy:
      resources:
        limits:
          # Docling's layout/table models move to GPU VRAM; CPU RAM holds the pipeline
          # orchestration, Postgres/Redis connections, and non-GPU artefacts.
          # 4 GiB CPU RAM is ample even with GPU tensors offloaded.
          cpus: "4"
          memory: 4g
        reservations:
          devices:
            # Same NVIDIA Container Toolkit reservation as bge_server above.
            # Both services can share the same GPU on a single-GPU host — CUDA contexts
            # are multiplexed by the driver; adjust count: 1 to a specific device index
            # (e.g. count: 0) if you want to pin each service to a dedicated GPU.
            - driver: nvidia
              count: all
              capabilities: [gpu]
