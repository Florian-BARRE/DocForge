# Alembic configuration for the docforge-rework schema.
# The database URL is NOT set here — migrations/env.py injects it from the DATABASE_URL env var,
# so no connection string is ever hardcoded in the repo.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# ─── Logging (Alembic-internal; the apps use loggerplusplus, this drives only the CLI) ───
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
