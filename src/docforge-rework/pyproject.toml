# Dependency contract for the docforge-rework clean-slate tree.
# Deps-only (non-package) project: code runs from source via sys.path bootstrap, never
# pip-installed. Deliberately minimal — this is a from-scratch rewrite, so only the
# elementary packages we are certain to need are declared here. Add more as the
# structure grows, never speculatively.
[project]
name = "docforge-rework"
version = "0.0.1"
description = "DocForge clean-slate rewrite — minimal foundation"
requires-python = ">=3.12"
dependencies = [
    # Web framework (uvicorn + python-multipart come transitively via [standard])
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.10.0",
    # Config & logging (internal libraries, pulled from the default index)
    "configplusplus>=0.1.0",
    "loggerplusplus>=1.0.0",
    # Startup banner (used by the FastAPI lifespan)
    "pyfiglet>=1.0.2",
    # Job queue — ArqRedis pool to enqueue worker jobs (pulls redis transitively)
    "arq>=0.28.0",
    # LLM — LangChain message types + adapted chat clients (per provider node)
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.3",
    "langchain-mistralai>=1.1.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "qdrant-client>=1.18.0",
    "aioboto3>=15.5.0",
    "pypdf>=6.14.2",
    "httpx>=0.28.1",
    # Token counting (chunker) — transitive via langchain-openai anyway; declared for intent
    "tiktoken>=0.13.0",
]

[tool.uv]
# Deps-only project: do not build/install the local tree as a package — the apps run
# from source via sys.path (entrypoint bootstrap).
package = false

[dependency-groups]
# Dev tooling — installed by `uv sync` locally, excluded from runtime images.
dev = [
    "psycopg2-binary>=2.9.12",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
worker = [
    "docling>=2.108.0",
    "pillow>=12.3.0",
    "pypdfium2>=5.11.0",
    "rapidocr-onnxruntime>=1.4.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "F541",   # f-string without placeholder (loggerplusplus convention)
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files are hand-organised into labelled domain sections (python.md convention),
# which deliberately conflicts with isort's single-sorted-block rule.
"**/__init__.py" = ["I001"]

[tool.ruff.lint.isort]
# First-party namespaces of the source tree (shared/libs/* + the per-app config/backend). Declaring
# them lets isort's grouping line up with the four labelled import sections from python.md instead of
# lumping them in with third-party packages.
known-first-party = ["shared_libs", "base_config", "config", "backend", "libs"]
