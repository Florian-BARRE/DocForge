# Alembic configuration — docforge-rework shared schema.
# Run from src/docforge-rework/shared/:  uv run alembic revision --autogenerate -m "…"
#                                        uv run alembic upgrade head
# The database URL is NOT set here — env.py reads POSTGRES_DSN (services/docforge-rework/.env
# in local dev, injected by compose in containers).

[alembic]
script_location = %(here)s/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
