[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docforge-sdk"
description = "Typed async + sync Python client for the DocForge REST API (standalone, zero server deps)."
readme = "README.md"
requires-python = ">=3.12"
# SPDX expression form (PEP 639). Hatchling ships the LICENSE file automatically in the sdist/wheel.
license = "MIT"
authors = [{ name = "Florian Barré" }]
keywords = [
    "docforge",
    "sdk",
    "client",
    "rag",
    "document-intelligence",
    "retrieval",
    "api-client",
    "async",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
dynamic = ["version"]
dependencies = [
    # HTTP transport for both the async and sync clients.
    "httpx>=0.28",
    # Request/response models and validation.
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/Florian-BARRE/docforge"
Repository = "https://github.com/Florian-BARRE/docforge"
Issues = "https://github.com/Florian-BARRE/docforge/issues"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.version]
path = "docforge_sdk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["docforge_sdk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "F541",   # f-string without placeholder
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["docforge_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits a running DocForge API (needs a live stack; opt-in via `-m live`).",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
