[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docforge-sdk"
description = "Typed async + sync Python client for the DocForge REST API (standalone, zero server deps)."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    # HTTP transport for both the async and sync clients.
    "httpx>=0.28",
    # Request/response models and validation.
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.version]
path = "docforge_sdk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["docforge_sdk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "F541",   # f-string without placeholder
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["docforge_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
