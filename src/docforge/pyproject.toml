[project]
name = "docforge"
version = "0.1.0"
description = "Document intelligence platform: multi-format → IR → enrichment → hybrid retrieval"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.12",
    # Database (async)
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Object store (MinIO / S3-compat)
    "aioboto3>=13.0.0",
    # HTTP client (Gotenberg, provider APIs)
    "httpx>=0.28.0",
    # Document parsing
    "docling>=2.14.0",
    "pymupdf>=1.25.0",
    # Hashing
    "blake3>=1.0.1",
    # Image handling
    "pillow>=11.0.0",
    # Job queue (infrastructure included from P1, wired in P2)
    "arq>=0.26.1",
    "redis>=5.2.0",
    # Vector store (P4)
    "qdrant-client>=1.12.0",
    # Config & logging (internal libraries)
    "loggerplusplus>=1.0.0",
    "configplusplus>=0.1.0",
    # MCP server (P6 — Claude Code / Claude Desktop integration)
    "mcp>=1.0.0",
    # Startup banner
    "pyfiglet>=1.0.2",
    "py3langid>=0.3.0",
]

[project.optional-dependencies]
# GPU variant: install torch with CUDA 11.8 wheels separately:
#   uv pip install torch --extra-index-url https://download.pytorch.org/whl/cu118
gpu = []

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",  # async test client
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "F541",   # f-string without placeholder (loggerplusplus convention)
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "libs", "backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
