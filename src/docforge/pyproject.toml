# Dependency contract for the docforge clean-slate tree.
# Deps-only (non-package) project: code runs from source via sys.path bootstrap, never
# pip-installed. Deliberately minimal — this is a from-scratch rewrite, so only the
# elementary packages we are certain to need are declared here. Add more as the
# structure grows, never speculatively.
[project]
name = "docforge"
version = "0.14.36"
description = "DocForge clean-slate rewrite — minimal foundation"
requires-python = ">=3.12"
dependencies = [
    # Web framework (uvicorn + python-multipart come transitively via [standard])
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.10.0",
    # Config & logging (internal libraries, pulled from the default index)
    "configplusplus>=0.1.0",
    "loggerplusplus>=1.0.0",
    # Startup banner (used by the FastAPI lifespan)
    "pyfiglet>=1.0.2",
    # Job queue — ArqRedis pool to enqueue worker jobs (pulls redis transitively)
    "arq>=0.28.0",
    # LLM — LangChain message types + adapted chat clients (per provider node)
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.3",
    "langchain-mistralai>=1.1.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "qdrant-client>=1.18.0",
    "aioboto3>=15.5.0",
    "pypdf>=6.14.2",
    "httpx>=0.28.1",
    # Token counting (chunker) — transitive via langchain-openai anyway; declared for intent
    "tiktoken>=0.13.0",
    "limits>=3.13",
    "prometheus-client>=0.21.0",
    "msgpack>=1.1.0",
]

# Torch is a transitive dep of docling (worker group). Declared here as a DIRECT dep split across
# cpu/gpu extras so uv sources can steer it to the right wheel index — without a direct declaration
# uv sources are ignored for transitive deps and torch resolves from PyPI (the multi-GiB CUDA build,
# which fills a CPU dev VM's disk). The worker image selects the variant via ARG TORCH_VARIANT.
[project.optional-dependencies]
# torchvision MUST come from the same wheel index as torch — a PyPI torchvision compiled against a
# different torch fails at import with "operator torchvision::nms does not exist" (ABI mismatch).
cpu = ["torch", "torchvision"]
gpu = ["torch", "torchvision"]

[tool.uv]
# Deps-only project: do not build/install the local tree as a package — the apps run
# from source via sys.path (entrypoint bootstrap).
package = false
# cpu and gpu torch are mutually exclusive — uv enforces this at lock time.
conflicts = [
    [{ extra = "cpu" }, { extra = "gpu" }],
]

[tool.uv.sources]
# Route torch to the correct wheel index per active extra. pytorch-cpu = ~200 MB CPU-only wheel
# (no nvidia-* payload); pytorch-cu128 = CUDA 12.8 wheels for a GPU host.
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
# Dev tooling — installed by `uv sync` locally, excluded from runtime images.
dev = [
    "fakeredis>=2.37.1",
    "psycopg2-binary>=2.9.12",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]
worker = [
    "docling>=2.108.0",
    # docling pulls transformers transitively with NO upper bound; uv resolves the latest (5.x),
    # whose AutoProcessor API breaks docling 2.108 (ModuleNotFoundError at parse). Pin to 4.x.
    "transformers>=4.46,<5",
    "pillow>=12.3.0",
    "pypdfium2>=5.11.0",
    "rapidocr-onnxruntime>=1.4.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "F541",   # f-string without placeholder (loggerplusplus convention)
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files are hand-organised into labelled domain sections (python.md convention),
# which deliberately conflicts with isort's single-sorted-block rule.
"**/__init__.py" = ["I001"]

[tool.ruff.lint.isort]
# First-party namespaces of the source tree (shared/libs/* + the per-app config/backend). Declaring
# them lets isort's grouping line up with the four labelled import sections from python.md instead of
# lumping them in with third-party packages.
known-first-party = ["shared_libs", "base_config", "config", "backend", "libs"]

[tool.coverage.run]
# Measure only actual product code — app/worker/shared — never the tests/ package itself, which is
# trivially ~100% self-covered and would inflate the floor into meaninglessness.
source = ["app", "worker", "shared"]

[tool.coverage.report]
show_missing = true
# CI floor for `tests/units --cov` (gate.yml "docforge" job). Measured 85.2% on 2026-09-01 (1085
# tests); set a few points below as a ratchet, not a red gate on day one. Raise this once new
# coverage lands — never lower it to make a red run green.
fail_under = 80
