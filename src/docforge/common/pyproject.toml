# Dependency contract for the whole DocForge source tree (src/common + src/backend + src/worker).
# This is a deps-only (non-package) project: the code is run from source via sys.path, never
# pip-installed. The backend image installs the base set; the worker image adds `--extra worker`.
[project]
name = "docforge"
version = "0.1.0"
description = "Document intelligence platform: multi-format → IR → enrichment → hybrid retrieval"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.12",
    # Database (async)
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Object store (MinIO / S3-compat)
    "aioboto3>=13.0.0",
    # HTTP client (Gotenberg, provider APIs)
    "httpx>=0.28.0",
    # PDF utilities (PyMuPDF/fitz) — used eagerly by the Gotenberg converter and page
    # rendering, so it stays in the base set (both backend and worker need it).
    "pymupdf>=1.25.0",
    # Hashing
    "blake3>=1.0.1",
    # Image handling
    "pillow>=11.0.0",
    # Job queue (infrastructure included from P1, wired in P2)
    "arq>=0.26.1",
    "redis>=5.2.0",
    # Vector store (P4)
    "qdrant-client>=1.12.0",
    # Authentication / authorization (JWT minting + argon2 password hashing)
    "pyjwt>=2.10.0",
    "argon2-cffi>=23.1.0",
    # Config & logging (internal libraries)
    "loggerplusplus>=1.0.0",
    "configplusplus>=0.1.0",
    # Startup banner
    "pyfiglet>=1.0.2",
    "py3langid>=0.3.0",
    "psutil>=7.2.2",
    "nvidia-ml-py>=13.610.43",
    "sse-starlette>=3.4.4",
]

[project.optional-dependencies]
# Worker-only heavy ingestion stack. ONLY the arq worker runs the pipeline (S0->S6),
# so only the worker image installs this. The backend imports the provider modules
# (e.g. for stage discovery) but never triggers their lazy `import docling` — it never
# calls DoclingBackend.parse() — so it ships without docling/torch/opencv (~2-3 GB lighter).
# Docling pulls torch + torchvision transitively (via docling-ibm-models); the WHEEL
# VARIANT of that torch (CPU vs CUDA) is selected by the cpu/gpu extra below, not here.
# Install in the worker image with:  uv sync --frozen --no-dev --extra worker --extra cpu
worker = [
    "docling>=2.14.0",
]

# ── Torch variant extras (worker image only) ──────────────────────────────────────────
# Docling drags torch + torchvision in transitively, but uv only honours [tool.uv.sources]
# wheel-index routing for DIRECT dependencies. We therefore re-declare torch and torchvision
# as direct deps inside these two mutually-exclusive extras so the sources block below can
# steer them to the right wheel index. Exactly ONE extra must be selected at install time:
#   cpu  → CPU-only torch wheels (~200 MB, no nvidia-* libs).  This is the COMMITTED DEFAULT.
#   gpu  → CUDA 12.4 torch wheels (~2 GB + nvidia-* runtime).  Opt-in, GPU-accelerated parsing.
# The two extras are declared CONFLICTING in [tool.uv] below so uv enforces mutual exclusivity
# at lock time and never installs both torch wheels at once. The worker Dockerfile selects the
# active extra via ARG TORCH_VARIANT (default: cpu), mirroring src/bge_server.
#
# Build commands:
#   CPU (default): docker compose build worker
#   GPU (opt-in):  docker build --build-arg TORCH_VARIANT=gpu \
#                    -f src/docforge/worker/Dockerfile -t docforge-worker:gpu src
cpu = ["torch", "torchvision"]
gpu = ["torch", "torchvision"]

dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",  # async test client
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.uv]
# Deps-only project: do not build/install the local tree as a package — the apps run
# from source via sys.path (entrypoint bootstrap src/common + their own dir).
package = false
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
]

# Declare the cpu and gpu torch extras as mutually exclusive — uv enforces this at lock time
# and raises an error if both are requested simultaneously (mirrors src/bge_server).
conflicts = [
    [{ extra = "cpu" }, { extra = "gpu" }],
]

[tool.uv.sources]
# Route torch AND torchvision to the correct wheel index depending on the active extra.
# Both are direct deps of the cpu/gpu extras (see [project.optional-dependencies]) precisely
# so this routing applies — uv ignores sources for purely-transitive deps. The app image
# (no worker/cpu/gpu extra) never pulls torch, so these sources are inert for it.
# pytorch-cpu: CPU-only wheels (~200 MB), no CUDA runtime payload — the committed default.
# pytorch-cu124: CUDA 12.4 wheels, compatible with Ada (RTX 40xx, compute 8.9) and later.
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "gpu" },
]

[[tool.uv.index]]
# CPU-only torch wheels — the default variant. Keeps the worker image lean.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
# CUDA 12.4 torch wheels — RTX 40xx (compute 8.9), RTX 30xx (compute 8.6), and later.
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "F541",   # f-string without placeholder (loggerplusplus convention)
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# E402: intentional plugin auto-registration pattern — auto_import(__name__) must run
# before provider imports so @register decorators fire in dependency order.
"common_libs/providers/**/__init__.py" = ["E402"]

[tool.ruff.lint.isort]
# First-party namespaces across the multi-root layout: shared (common_libs/config) and the
# per-app dedicated trees (libs/backend live under src/backend, src/worker).
known-first-party = ["config", "common_libs", "libs", "backend"]

# NOTE: pytest config lives with the test suite (src/tests) now that the tree is multi-root;
# running tests needs src/common + src/backend + src/worker on PYTHONPATH (see src/tests).

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
