[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    live: requires the running compose stack (postgres/qdrant/s3/redis + the API on :8000)
    db: requires a real Postgres (throwaway db created/dropped per tests/db/conftest.py) — NOT
        collected by `tests/units`; select explicitly with `-m db` (see tests/db/)
filterwarnings =
    # Do NOT blanket-ignore DeprecationWarnings — surface OURS so a deprecation we introduce is
    # visible. Silence only the single known third-party noise: Starlette's TestClient warning about
    # httpx (verified the only DeprecationWarning source in the serviceless suite).
    default::DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:DeprecationWarning
