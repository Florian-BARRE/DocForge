[pytest]
# Run from src/docforge/. tests/conftest.py bootstraps sys.path for the multi-root layout
# (common + app + worker + docforge), so `config`, `common_libs.*`, `backend.*`, `libs.*`
# and `tests.*` all resolve. The live suite (tests/live_test) auto-skips when the stack is down.
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
