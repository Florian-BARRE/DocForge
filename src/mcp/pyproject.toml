[project]
name = "docforge-mcp"
version = "0.31.3"
description = "DocForge MCP server — exposes the full DocForge REST API as MCP tools (pure HTTP client)"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    # MCP server SDK, 2.x line (MCPServer). >= 2.3 for MCPServer(subscriptions=False) and the
    # streamable_http_app() kwargs this server passes; it still serves every 2025-era client
    # (handshake versions 2024-11-05..2025-11-25) next to protocol 2026-07-28. < 3 so a routine
    # lock refresh can't cross the next major: ErrorTranslatingMCPServer reaches into private
    # tool-manager API (extra="forbid") that a major may change.
    "mcp>=2.3,<3",
    # Typed async+sync DocForge REST API client — brings httpx transitively.
    "docforge-sdk",
    # ASGI server + framework for the streamable-HTTP transport and the auth middleware. Upper
    # bounds guardrail a routine lock refresh away from a breaking major (uvicorn is pre-1.0, so
    # its next major is 1.0; starlette's is 2.0) — both caps clear the currently-locked versions
    # and move nothing. This server hand-wires an auth middleware on the starlette layer, so an
    # unreviewed jump across a starlette major is exactly what we want to block here.
    "uvicorn[standard]>=0.54.0,<1",
    "starlette>=1.10.0,<2",
    # Config & logging (internal libraries) — same sources as the main docforge app. Left
    # unbounded on purpose: internally-versioned, not steered by an external release cadence.
    "loggerplusplus>=1.2.0",
    "configplusplus>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
]

[tool.uv]
# This app is run as scripts (python entrypoint.py), not installed as a package — only its
# dependencies are resolved. Avoids needing a build backend / wheel for the project itself.
package = false

[tool.uv.sources]
docforge-sdk = { path = "../docforge_sdk", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "F541",   # f-string without placeholder (loggerplusplus convention)
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["client_env", "config_loader", "conftest", "libs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: resolves a throwaway client environment with uv (tests/contract); deselect with -m 'not slow'",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
