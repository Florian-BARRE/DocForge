[project]
name = "docforge-mcp"
version = "0.14.49"
description = "DocForge MCP server — exposes the full DocForge REST API as MCP tools (pure HTTP client)"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    # MCP server SDK — streamable_http_app() requires >= 1.8.0. Pinned >= 1.28.1 (clears the 1.28.0
    # WebSocket-transport advisory PYSEC-2026-3483, not on this server's http/stdio path) and < 2 so
    # a routine lock refresh can't jump to the 2.x line, which changes the FastMCP API this server uses.
    "mcp>=1.28.1,<2",
    # Typed async+sync DocForge REST API client — brings httpx transitively.
    "docforge-sdk",
    # ASGI server + framework for the streamable-HTTP transport and the auth middleware. Upper
    # bounds guardrail a routine lock refresh away from a breaking major (uvicorn is pre-1.0, so
    # its next major is 1.0; starlette's is 2.0) — both caps clear the currently-locked versions
    # and move nothing. This server hand-wires an auth middleware on the starlette layer, so an
    # unreviewed jump across a starlette major is exactly what we want to block here.
    "uvicorn[standard]>=0.32.0,<1",
    "starlette>=1.6.0,<2",
    # Config & logging (internal libraries) — same sources as the main docforge app. Left
    # unbounded on purpose: internally-versioned, not steered by an external release cadence.
    "loggerplusplus>=1.0.0",
    "configplusplus>=0.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
]

[tool.uv]
# This app is run as scripts (python entrypoint.py), not installed as a package — only its
# dependencies are resolved. Avoids needing a build backend / wheel for the project itself.
package = false

[tool.uv.sources]
docforge-sdk = { path = "../docforge_sdk", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "F541",   # f-string without placeholder (loggerplusplus convention)
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["config_loader", "libs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
