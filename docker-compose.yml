# DocForge — production compose file (Docker Compose v2).
# Run with:
#   docker compose up -d
#
# All services communicate on the internal `docforge_net` network.
# External ports are exposed only where operator access is needed (API, Postgres).
#
# Resource limits:
#   Every service declares `deploy.resources.limits` (cpus + memory). These are
#   HARD CEILINGS (not reservations) honoured by `docker compose up` in v2 — they
#   cap runaway usage so no single container can starve the WSL2 VM (~15.5 GiB on
#   this host) and trigger engine instability. Values are sized from observed
#   usage with generous headroom: heavy on the ML/parsing services
#   (worker / tei / reranker) and tight on the lightweight ones.

services:

  # ── DocForge FastAPI application ─────────────────────────────────────────────
  docforge:
    build:
      context: src            # Build context: the src/ directory (per docker.md rules)
      dockerfile: docforge/app/Dockerfile
    image: docforge:latest
    ports:
      - "10020:8000"          # FastAPI — public API endpoint (firewall: only 10000-11000 open)
    env_file:
      - services/docforge/.env
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started   # SeaweedFS has no healthcheck; started is sufficient
      gotenberg:
        condition: service_started
      redis:
        condition: service_started
      tei:
        condition: service_started   # Query-time embedding needs TEI at startup
    # API is I/O-bound at runtime (embeds delegated to TEI); 2 GiB / 2 CPUs is ample.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    restart: unless-stopped
    networks:
      - docforge_net

  # ── PostgreSQL 16 — relational catalogue & job store ─────────────────────────
  postgres:
    image: postgres:16-bookworm
    env_file:
      - services/postgres/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Catalogue/job store: small footprint, 1 GiB / 1 CPU is comfortable.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    restart: unless-stopped
    networks:
      - docforge_net

  # ── SeaweedFS — S3-compatible object store (replaces MinIO) ──────────────────
  # chrislusf/seaweedfs: open-source, S3-compatible, actively maintained.
  # `weed server` starts master + volume + filer + S3 gateway in one process.
  # S3 API is available on port 8333; master on 9333; volume on 8080.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: >
      server
      -dir=/data
      -s3
      -s3.port=8333
      -master.volumeSizeLimitMB=256
      -volume.max=0
    ports:
      - "10021:8333"          # SeaweedFS S3 API — DocForge accesses via internal network (8333); 10021 for direct inspection
      - "10022:9333"          # SeaweedFS master UI (firewall: only 10000-11000 open)
    volumes:
      - seaweedfs_data:/data
      # s3_config.json is kept for reference but not loaded — running without S3 auth is safe on
      # the internal docker network (port 10021 is for operator inspection only, not external access)
    # Object gateway: light steady-state; 1 GiB / 1 CPU caps it without throttling I/O.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    restart: unless-stopped
    networks:
      - docforge_net

  # ── Gotenberg 8 — document format conversion (LibreOffice + Chromium) ────────
  # Only converter in DocForge (spec ADR-3). Converts office formats → PDF.
  gotenberg:
    image: gotenberg/gotenberg:8
    env_file:
      - services/gotenberg/.env
    # LibreOffice + Chromium spike during conversion; 2 GiB / 2 CPUs absorbs the bursts.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    restart: unless-stopped
    networks:
      - docforge_net

  # ── Redis — arq job queue backend ────────────────────────────────────────────
  redis:
    image: redis:7-bookworm
    env_file:
      - services/redis/.env
    volumes:
      - redis_data:/data
    # Pure job-queue broker: tiny resident set; 512 MiB / 1 CPU is plenty.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    restart: unless-stopped
    networks:
      - docforge_net

  # ── Qdrant — vector database (dense + sparse multi-vector collections) ───────
  # Used by S6 (embedding + indexing) and hybrid search (RRF fusion).
  # Data is persisted in a named volume so collections survive container restarts.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "10025:6333"              # Qdrant REST API — for operator inspection
    volumes:
      - qdrant_data:/qdrant/storage
    # Vector index/search grows with collection size; 2 GiB / 2 CPUs is a sane cap.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    restart: unless-stopped
    networks:
      - docforge_net

  # ── TEI — BGE-M3 embedding server (dense + sparse BM25) ─────────────────────
  # Text Embeddings Inference in CPU mode (no GPU required).
  # Serves: POST /embed (dense 1024-dim), POST /embed_sparse (BM25), GET /health.
  # Model is downloaded on first start and cached in the tei_cache volume (~1.1 GB).
  # Required by both the API (query-time search) and the worker (S6 ingestion).
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    # --model-id: BGE-M3 — the only model supported by the TeiEmbedProvider in this project.
    # --port: listen on 80 inside the container (TEI default; matched by TEI_BASE_URL in .env).
    # The cpu-1.5 image has no GPU support built in — no --disable-gpu flag needed.
    command: --model-id BAAI/bge-m3 --port 80
    ports:
      - "10026:80"              # Operator access: http://localhost:10026/health to verify liveness
    volumes:
      - tei_cache:/data         # Cache downloaded model weights between restarts
    # CPU embedding is compute-bound; 3 CPUs keeps it responsive, 3 GiB covers batch buffers.
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 3g
    restart: unless-stopped
    networks:
      - docforge_net

  # ── Reranker — BGE-Reranker-v2-m3 cross-encoder (TEI CPU) ──────────────────
  # Same TEI image as the embed service; different model (bge-reranker-v2-m3),
  # different container, different port.  Used by the search pipeline rerank stage.
  # Model is downloaded on first start and cached in the reranker_model_cache volume (~1.1 GB).
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    # --model-id: BGE-Reranker-v2-m3 — cross-encoder for search result re-ranking.
    # --port: listen on 80 inside the container (matched by BGE_RERANKER_URL in .env).
    # --max-client-batch-size: upper limit per HTTP request to avoid OOM on large sets.
    command: --model-id BAAI/bge-reranker-v2-m3 --port 80 --max-client-batch-size 128
    volumes:
      - reranker_model_cache:/root/.cache/huggingface   # Cache downloaded model weights
    # Cross-encoder model is ~2.1 GiB resident; 3 GiB ceiling + 3 CPUs for batch scoring.
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 3g
    restart: unless-stopped
    networks:
      - docforge_net

  # ── arq pipeline worker ────────────────────────────────────────────────────
  # Dedicated HEAVY image (Dockerfile.worker = base + docling/torch/opencv) — this is the
  # only service that runs the ingestion pipeline (S0→S6). The backend image is kept light
  # by omitting the worker dependency group. Workers pull jobs from Redis and process
  # documents independently of the API. arq is launched by the image CMD (no override).
  worker:
    build:
      context: src
      dockerfile: docforge/worker/Dockerfile
    image: docforge-worker:latest
    env_file:
      - services/docforge/.env
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      gotenberg:
        condition: service_started
      redis:
        condition: service_started
      tei:
        condition: service_started   # S6 ingestion needs TEI for embedding
    # Heaviest service: Docling parsing + pipeline stages. 4 GiB / 4 CPUs is the
    # largest budget here, sized so ingestion stays workable without monopolising the host.
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
    restart: unless-stopped
    networks:
      - docforge_net

  # ── pgAdmin 4 — PostgreSQL web administration UI ─────────────────────────────
  # Operator/inspection tool only — reaches Postgres by service name over the
  # internal network. The DocForge server connection is fully auto-provisioned:
  #   * servers.json  → pre-registers the "DocForge" server (host/port/user/db).
  #   * pgpass        → pre-fills the Postgres password (referenced as PassFile).
  # On first start pgAdmin imports these, so you only log into the pgAdmin web UI
  # (credentials in services/pgadmin/.env) — no manual server setup is required.
  pgadmin:
    image: dpage/pgadmin4:latest
    env_file:
      - services/pgadmin/.env
    environment:
      # Tell pgAdmin where to find the server definitions to import at boot.
      - PGADMIN_SERVER_JSON_FILE=/pgadmin4/servers.json
    volumes:
      # Read-only provisioning files imported once during startup.
      - ./services/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./services/pgadmin/pgpass:/pgpass:ro
      # Persist pgAdmin's own config DB (imported servers, preferences) across restarts.
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "10028:80"            # pgAdmin web UI — firewall: only 10000-11000 open
    depends_on:
      postgres:
        condition: service_healthy
    # Inspection UI only — not on the hot path; 512 MiB / 1 CPU is enough.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    restart: unless-stopped
    networks:
      - docforge_net

  # ── MCP server — DocForge tools over streamable HTTP ────────────────────────
  # Standalone minimal image (httpx + mcp + uvicorn only — none of the ML stack).
  # Pure HTTP client of the docforge API: exposes the full REST surface as MCP tools so any
  # LLM/chatbot can drive DocForge. Reaches the API by service name over docforge_net.
  # The port is published, so a bearer token (MCP_AUTH_TOKEN in services/docforge_mcp/.env)
  # is mandatory — the server refuses to start in HTTP mode without it.
  mcp:
    build:
      context: src                  # Same context as docforge so sibling app folders are visible
      dockerfile: mcp/Dockerfile
    image: docforge-mcp:latest
    command: python entrypoint.py
    env_file:
      - services/docforge_mcp/.env
    environment:
      - MCP_TRANSPORT=streamable-http     # Container always serves over HTTP
      - DOCFORGE_API_URL=http://docforge:8000
    ports:
      - "10030:9000"              # MCP streamable-http endpoint at /mcp (firewall: 10000-11000)
    depends_on:
      docforge:
        condition: service_started
    # Thin HTTP proxy to the API — negligible footprint; 512 MiB / 1 CPU.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    restart: unless-stopped
    networks:
      - docforge_net

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:    # PostgreSQL WAL + data files
  seaweedfs_data:   # SeaweedFS chunk data (originals + derived artifacts)
  redis_data:       # Redis persistence (arq job queue)
  qdrant_data:      # Qdrant vector collections (dense + sparse indexes)
  tei_cache:        # BGE-M3 model weights — ~1.1 GB, cached across restarts
  reranker_model_cache:  # BGE-Reranker-v2-m3 model weights — ~1.1 GB, cached across restarts
  pgadmin_data:     # pgAdmin config DB (imported servers, preferences)

# ── Internal network ──────────────────────────────────────────────────────────
networks:
  docforge_net:
    driver: bridge
