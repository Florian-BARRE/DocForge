# ─────────────────────────────────────────────────────────────────────────────
# DocForge — thin root entrypoint. Includes the prod-CPU scenario so a bare
#   docker compose --profile full up -d
# at the repo root keeps working exactly as before the compose/ reorg (see compose/README.md
# for the full usage matrix). For every other scenario (GPU, dev, proxy, telemetry), use the
# files under compose/ directly — see compose/README.md and the root Makefile.
# ─────────────────────────────────────────────────────────────────────────────

name: docforge

include:
  - compose/compose.prod-cpu.yml
