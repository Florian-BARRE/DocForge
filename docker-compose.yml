# DocForge — production compose file (Docker Compose v2).
# Run with:
#   docker compose up -d
#
# All services communicate on the internal `docforge_net` network.
# External ports are exposed only where operator access is needed (API, Postgres).

services:

  # ── DocForge FastAPI application ─────────────────────────────────────────────
  docforge:
    build:
      context: src            # Build context: the src/ directory (per docker.md rules)
      dockerfile: docforge/Dockerfile
    image: docforge:latest
    ports:
      - "10020:8000"          # FastAPI — public API endpoint (firewall: only 10000-11000 open)
    env_file:
      - services/docforge/.env
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started   # SeaweedFS has no healthcheck; started is sufficient
      gotenberg:
        condition: service_started
      redis:
        condition: service_started
      tei:
        condition: service_started   # Query-time embedding needs TEI at startup
    restart: unless-stopped
    networks:
      - docforge_net

  # ── PostgreSQL 16 — relational catalogue & job store ─────────────────────────
  postgres:
    image: postgres:16-bookworm
    env_file:
      - services/postgres/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - docforge_net

  # ── SeaweedFS — S3-compatible object store (replaces MinIO) ──────────────────
  # chrislusf/seaweedfs: open-source, S3-compatible, actively maintained.
  # `weed server` starts master + volume + filer + S3 gateway in one process.
  # S3 API is available on port 8333; master on 9333; volume on 8080.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: >
      server
      -dir=/data
      -s3
      -s3.port=8333
      -master.volumeSizeLimitMB=256
      -volume.max=0
    ports:
      - "10021:8333"          # SeaweedFS S3 API — DocForge accesses via internal network (8333); 10021 for direct inspection
      - "10022:9333"          # SeaweedFS master UI (firewall: only 10000-11000 open)
    volumes:
      - seaweedfs_data:/data
      # s3_config.json is kept for reference but not loaded — running without S3 auth is safe on
      # the internal docker network (port 10021 is for operator inspection only, not external access)
    restart: unless-stopped
    networks:
      - docforge_net

  # ── Gotenberg 8 — document format conversion (LibreOffice + Chromium) ────────
  # Only converter in DocForge (spec ADR-3). Converts office formats → PDF.
  gotenberg:
    image: gotenberg/gotenberg:8
    env_file:
      - services/gotenberg/.env
    restart: unless-stopped
    networks:
      - docforge_net

  # ── Redis — arq job queue backend ────────────────────────────────────────────
  redis:
    image: redis:7-bookworm
    env_file:
      - services/redis/.env
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - docforge_net

  # ── Qdrant — vector database (dense + sparse multi-vector collections) ───────
  # Used by S6 (embedding + indexing) and hybrid search (RRF fusion).
  # Data is persisted in a named volume so collections survive container restarts.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "10025:6333"              # Qdrant REST API — for operator inspection
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - docforge_net

  # ── TEI — BGE-M3 embedding server (dense + sparse BM25) ─────────────────────
  # Text Embeddings Inference in CPU mode (no GPU required).
  # Serves: POST /embed (dense 1024-dim), POST /embed_sparse (BM25), GET /health.
  # Model is downloaded on first start and cached in the tei_cache volume (~1.1 GB).
  # Required by both the API (query-time search) and the worker (S6 ingestion).
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    # --model-id: BGE-M3 — the only model supported by the TeiEmbedProvider in this project.
    # --port: listen on 80 inside the container (TEI default; matched by TEI_BASE_URL in .env).
    # The cpu-1.5 image has no GPU support built in — no --disable-gpu flag needed.
    command: --model-id BAAI/bge-m3 --port 80
    ports:
      - "10026:80"              # Operator access: http://localhost:10026/health to verify liveness
    volumes:
      - tei_cache:/data         # Cache downloaded model weights between restarts
    restart: unless-stopped
    networks:
      - docforge_net

  # ── Reranker — BGE-Reranker-v2-m3 cross-encoder (TEI CPU) ──────────────────
  # Same TEI image as the embed service; different model (bge-reranker-v2-m3),
  # different container, different port.  Used by the search pipeline rerank stage.
  # Model is downloaded on first start and cached in the reranker_model_cache volume (~1.1 GB).
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    # --model-id: BGE-Reranker-v2-m3 — cross-encoder for search result re-ranking.
    # --port: listen on 80 inside the container (matched by BGE_RERANKER_URL in .env).
    # --max-client-batch-size: upper limit per HTTP request to avoid OOM on large sets.
    command: --model-id BAAI/bge-reranker-v2-m3 --port 80 --max-client-batch-size 128
    volumes:
      - reranker_model_cache:/root/.cache/huggingface   # Cache downloaded model weights
    restart: unless-stopped
    networks:
      - docforge_net

  # ── arq pipeline worker ────────────────────────────────────────────────────
  # Runs the same Docker image as the API but executes arq tasks (S0→S1 pipeline).
  # Workers pull jobs from Redis and process documents independently of the API.
  worker:
    build:
      context: src
      dockerfile: docforge/Dockerfile
    image: docforge:latest      # Same image as the API — reuses cached layer
    env_file:
      - services/docforge/.env
    # arq CLI: `arq <module>.<WorkerSettings class>` run from WORKDIR /app/docforge
    command: arq arq_worker.WorkerSettings
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      gotenberg:
        condition: service_started
      redis:
        condition: service_started
      tei:
        condition: service_started   # S6 ingestion needs TEI for embedding
    restart: unless-stopped
    networks:
      - docforge_net

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:    # PostgreSQL WAL + data files
  seaweedfs_data:   # SeaweedFS chunk data (originals + derived artifacts)
  redis_data:       # Redis persistence (arq job queue)
  qdrant_data:      # Qdrant vector collections (dense + sparse indexes)
  tei_cache:        # BGE-M3 model weights — ~1.1 GB, cached across restarts
  reranker_model_cache:  # BGE-Reranker-v2-m3 model weights — ~1.1 GB, cached across restarts

# ── Internal network ──────────────────────────────────────────────────────────
networks:
  docforge_net:
    driver: bridge
