# ============================================================================
# Release workflow for the `docforge-sdk` package (src/docforge_sdk).
#
# `workflow_call`-ONLY: this file has no `on: push: tags:` of its own — it is fanned out to by
# release.yml (the release orchestrator), which runs the shared quality gate EXACTLY ONCE per tag
# and then calls this file with `needs: gate`. So a tag on a broken or backend-incompatible tree
# never reaches the publish step. Kept as its own file (not inlined into release.yml) ON PURPOSE:
# PyPI Trusted Publishing matches on the filename of the reusable workflow that DEFINES the
# publish job, not the top-level caller (PyPI explicitly documents this for reusable workflows —
# https://docs.pypi.org/trusted-publishers/using-a-publisher/). Renaming or inlining this job
# would silently break the existing trusted publisher config below.
#
# Publishing goes to PyPI via Trusted Publishing (OIDC) — NO API token is stored in the repo.
#
# ---------------------------------------------------------------------------
# ONE-TIME MANUAL SETUP (maintainer, before the first release):
#   1. Reserve the project name `docforge-sdk` on PyPI (or let the first successful publish claim it).
#   2. In the PyPI project's "Publishing" settings, add a GitHub trusted publisher with EXACTLY:
#        - Owner:            Florian-BARRE
#        - Repository:       docforge
#        - Workflow name:    release-sdk.yml
#        - Environment:      pypi
#   3. Create a GitHub Environment named `pypi` on this repo.
#
# HOW TO RELEASE: see release.yml (the orchestrator). Both `v<version>` (unified lockstep) and
# `sdk-v<version>` (SDK-only escape hatch) tags reach this file — the version MUST match
# docforge_sdk/_version.py; the guard step below fails the run on mismatch.
#     git tag sdk-v0.1.0 && git push origin sdk-v0.1.0
# ============================================================================

name: release-sdk

on:
  workflow_call:

jobs:
  # 1. Build + publish. The gate itself already ran upstream, in release.yml, before this whole
  #    file was even called — see this file's header for why it's still its own workflow_call file.
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Declaring `permissions:` sets every UNLISTED scope to `none`, so both are required here:
      contents: read # actions/checkout must read the (private) repo
      id-token: write # PyPI Trusted Publishing (OIDC token minting)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify tag matches the package version
        # Fail fast if the pushed tag disagrees with _version.py, so a mistagged release can never
        # publish a mismatched artifact.
        run: |
          set -euo pipefail
          pkg_version="$(grep -oP '__version__\s*=\s*"\K[^"]+' src/docforge_sdk/docforge_sdk/_version.py)"
          # Accept either a unified `v*` tag or a legacy `sdk-v*` tag — strip whichever prefix.
          tag_version="${GITHUB_REF_NAME#sdk-v}"
          tag_version="${tag_version#v}"
          echo "Package version: ${pkg_version}"
          echo "Tag version:     ${tag_version}"
          if [ "${pkg_version}" != "${tag_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${pkg_version}"
            exit 1
          fi

      - name: Build sdist + wheel
        run: uv build
        working-directory: src/docforge_sdk

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: src/docforge_sdk/dist
