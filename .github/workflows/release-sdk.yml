# ============================================================================
# Release workflow for the `docforge-sdk` package (src/docforge_sdk).
#
# NOTHING PUBLISHES UNLESS THE FULL QUALITY GATE IS GREEN. The `publish` job `needs` the reusable
# `gate` (format + lint + type-check + every package's unit suite + frontend build + SDK↔backend
# OpenAPI coherence) — the SAME gate that guards every merge. So a tag on a broken or
# backend-incompatible tree runs the gate, fails, and never reaches the publish step.
#
# Publishing goes to PyPI via Trusted Publishing (OIDC) — NO API token is stored in the repo.
#
# ---------------------------------------------------------------------------
# ONE-TIME MANUAL SETUP (maintainer, before the first release):
#   1. Reserve the project name `docforge-sdk` on PyPI (or let the first successful publish claim it).
#   2. In the PyPI project's "Publishing" settings, add a GitHub trusted publisher with EXACTLY:
#        - Owner:            Florian-BARRE
#        - Repository:       docforge
#        - Workflow name:    release-sdk.yml
#        - Environment:      pypi
#   3. Create a GitHub Environment named `pypi` on this repo.
#
# HOW TO RELEASE:
#   Tag a commit with `sdk-v<version>` (dedicated prefix so it never fires for other packages) and
#   push it. The version MUST match docforge_sdk/_version.py; a guard step fails the run on mismatch.
#     git tag sdk-v0.1.0 && git push origin sdk-v0.1.0
# ============================================================================

name: release-sdk

on:
  push:
    tags:
      # Unified lockstep release: a single `v*` tag ships the images (release-images.yml) AND the SDK
      # at the same version. `sdk-v*` is kept as a legacy/SDK-only escape hatch.
      - "v*"
      - "sdk-v*"

# Workflow-level floor is read-only; `id-token: write` for PyPI Trusted Publishing is granted ONLY
# on the `publish` job below, never workflow-wide.
permissions:
  contents: read

jobs:
  # 1. Run the exact same gate that guards every merge — the publish job depends on it.
  gate:
    uses: ./.github/workflows/gate.yml

  # 2. Build + publish, ONLY after the gate is fully green.
  publish:
    needs: gate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Declaring `permissions:` sets every UNLISTED scope to `none`, so both are required here:
      contents: read # actions/checkout must read the (private) repo
      id-token: write # PyPI Trusted Publishing (OIDC token minting)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Verify tag matches the package version
        # Fail fast if the pushed tag disagrees with _version.py, so a mistagged release can never
        # publish a mismatched artifact.
        run: |
          set -euo pipefail
          pkg_version="$(grep -oP '__version__\s*=\s*"\K[^"]+' src/docforge_sdk/docforge_sdk/_version.py)"
          # Accept either a unified `v*` tag or a legacy `sdk-v*` tag — strip whichever prefix.
          tag_version="${GITHUB_REF_NAME#sdk-v}"
          tag_version="${tag_version#v}"
          echo "Package version: ${pkg_version}"
          echo "Tag version:     ${tag_version}"
          if [ "${pkg_version}" != "${tag_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${pkg_version}"
            exit 1
          fi

      - name: Build sdist + wheel
        run: uv build
        working-directory: src/docforge_sdk

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: src/docforge_sdk/dist
