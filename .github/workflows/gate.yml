# ============================================================================
# Reusable QUALITY GATE — the single source of truth for "is this tree shippable".
#
# Called by:
#   - ci.yml         (every push + PR)         → gate must be green to merge.
#   - release-sdk.yml (a pushed sdk-v* tag)     → publish `needs` this gate, so a
#                                                 broken/incompatible tree can NEVER publish.
#
# It gates EVERY package in this monorepo — format + lint + type-check + full unit
# suite — plus the frontend build and the SDK↔backend OpenAPI coherence check. Fully
# serviceless: all unit suites mock their stores, so no service containers, no docker
# builds, and no `-m live` test (which needs a running API) ever run here.
# ============================================================================

name: gate

on:
  workflow_call:

# Explicit least-privilege floor. Critically, this ALSO caps what the gate can inherit when called
# from a release workflow: a reusable workflow's effective GITHUB_TOKEN permissions are the most
# restrictive intersection of the caller's and the callee's own `permissions:` block, so declaring
# `contents: read` here means the gate can NEVER end up holding release-images.yml's `packages: write`
# (or release-sdk.yml's `id-token: write`), even though those workflows call it. No job below needs
# anything beyond checkout.
permissions:
  contents: read

jobs:
  docforge:
    # The v2 graph engine + app/worker. No mypy dev dep here by design (ruff is the enforced
    # linter for this package — see its pyproject.toml). Format + lint + mocked unit suite.
    name: docforge — format + lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/docforge
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --frozen
      - name: Format check (ruff format --check)
        run: uv run ruff format --check .
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Provide placeholder app config (serviceless suite)
        # The config loader (safe_load_envs) reads services/docforge/.env at import time; the
        # real file is gitignored and absent on CI, so materialize it from the committed template.
        # Nothing ever connects — the suite is fully mocked (placeholder DSN/URLs are never dialed).
        run: cp ../../services/docforge/.env.example ../../services/docforge/.env
      - name: Unit suite (serviceless, coverage-gated)
        # Coverage floor is a ratchet, not an instant-red gate — see [tool.coverage.report]
        # fail_under in src/docforge/pyproject.toml for the measured baseline this sits under.
        # Scoped to app/worker/shared (product code) — tests/ itself is excluded, it is
        # trivially ~100% self-covered and would inflate the number into meaninglessness.
        run: uv run pytest tests/units -q --cov=app --cov=worker --cov=shared --cov-report=term-missing

  db-tests:
    # DB-backed suite (`-m db`, tests/db/) — needs a REAL Postgres, unlike every other job in this
    # gate. Spins its OWN throwaway postgres:16 service container with credentials this job defines
    # (never the dev stack's) — each test then CREATEs/DROPs its own `docforge_test_*` database
    # against it, so the role needs CREATEDB (the default postgres image's POSTGRES_USER already
    # gets superuser, which covers it). Kept as a separate job (not folded into "docforge" above) so
    # the serviceless unit suite stays the fast fail-fast front with zero service-container cost.
    name: docforge — db-backed tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docforge
          POSTGRES_PASSWORD: docforge
          POSTGRES_DB: docforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: src/docforge
    env:
      # tests/db/conftest.py reads these; defaults already match (localhost/docforge/docforge), but
      # set explicitly so the job never silently depends on conftest's dev-stack-shaped defaults.
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_USER: docforge
      TEST_POSTGRES_PASSWORD: docforge
      TEST_POSTGRES_ADMIN_DB: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --frozen
      - name: DB-backed suite (real Postgres)
        run: uv run pytest tests/db -m db -q

  python-packages:
    # Uniform gate for the two lean Python packages: format + lint + mypy + tests.
    # Matrixed because the commands are identical modulo working directory / mypy target / pytest args.
    name: ${{ matrix.name }} — format + lint + mypy + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docforge_sdk
            working-directory: src/docforge_sdk
            mypy-target: "--strict docforge_sdk"
            pytest-args: -q -m "not live"
          - name: mcp
            # mcp depends on docforge_sdk via a [tool.uv.sources] path source (../docforge_sdk);
            # both live in the same checkout, so `uv sync --frozen` resolves it with no extra steps.
            working-directory: src/mcp
            mypy-target: "."
            pytest-args: -q
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --frozen
      - name: Format check (ruff format --check)
        run: uv run ruff format --check .
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Type check (mypy)
        run: uv run mypy ${{ matrix.mypy-target }}
      - name: Unit suite
        run: uv run pytest ${{ matrix.pytest-args }}

  bge-server:
    # Its own job (not folded into the matrix) because of its ML dependency cost: FlagEmbedding
    # is a hard dep and unconditionally pulls torch. The `cpu` extra steers uv to the CPU wheel
    # index (~200 MB) instead of the default CUDA build (~5 GB). `--no-sync` on later steps pins
    # the env so `uv run` can't silently re-resolve torch back to CUDA. Units are fully mocked, so
    # torch is a sync-time cost only, never an import-time one.
    name: bge_server — format + lint + mypy + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/bge_server
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked, CPU torch)
        run: uv sync --frozen --extra cpu
      - name: Format check (ruff format --check)
        run: uv run --no-sync ruff format --check .
      - name: Lint (ruff check)
        run: uv run --no-sync ruff check .
      - name: Type check (mypy)
        run: uv run --no-sync mypy .
      - name: Unit suite
        run: uv run --no-sync pytest -q

  paddle-server:
    # Mirrors bge-server exactly: own job (not the python-packages matrix) because of the ML
    # dependency cost. `cpu` extra steers uv to the CPU paddlepaddle wheel (~100 MB, plain PyPI)
    # instead of the GPU extra's CUDA index. `--no-sync` on later steps pins the env so `uv run`
    # can't silently re-resolve back onto a different variant. The one test module
    # (test_normalizer.py) imports nothing paddle-related, so this job never actually loads
    # paddlepaddle at test time — the sync cost is paid regardless, same as bge-server/torch.
    name: paddle_server — format + lint + mypy + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/paddle_server
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked, CPU paddlepaddle)
        run: uv sync --frozen --extra cpu
      - name: Format check (ruff format --check)
        run: uv run --no-sync ruff format --check .
      - name: Lint (ruff check)
        run: uv run --no-sync ruff check .
      - name: Type check (mypy)
        run: uv run --no-sync mypy .
      - name: Unit suite
        run: uv run --no-sync pytest -q

  frontend:
    name: frontend — lint + tsc + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/docforge/app/frontend
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/docforge/app/frontend/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Lint (eslint — rules-of-hooks is an error, not a warning)
        run: npm run lint
      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Render smoke tests (vitest)
        run: npm run test
      - name: Build (vite build)
        run: npm run build

  sdk-parity:
    # Coherence gate: the docforge-sdk models + committed OpenAPI snapshot MUST match the backend's
    # CURRENT schema, or this job goes RED — SDK/backend drift can never merge (nor publish). The
    # backend openapi is produced serviceless (FastAPI .openapi() only introspects routes; store
    # clients connect lazily), placeholder config from the committed .env.example.
    name: sdk-parity — SDK↔backend OpenAPI drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Dump the backend's current OpenAPI (serviceless)
        working-directory: src/docforge
        run: |
          set -a; grep -vE '^\s*#|^\s*$' ../../services/docforge/.env.example > /tmp/ci.env; . /tmp/ci.env; set +a
          export LOGGING_ENABLE_CONSOLE=false LOGGING_ENABLE_FILE=false
          uv sync --frozen
          uv run python app/scripts/dump_openapi.py > /tmp/current_openapi.json
          python -c "import json; print('schemas:', len(json.load(open('/tmp/current_openapi.json'))['components']['schemas']))"
      - name: Fail on SDK↔backend schema drift
        working-directory: src/docforge_sdk
        run: |
          uv sync --frozen
          uv run python tests/check_schema_drift.py /tmp/current_openapi.json
