# AI Dev Kit: the aidk-checks job (written by aidk project onboard and upgrade: change the kit, not this file).
# Where GitHub offers branch protection (a public repository, or a private one on a paid plan), make it a required
# status check (Settings > Branches > the base branch's rule): a branch that weakens a test or leaves the owns: of
# its pull request's description cannot be merged, whoever pushed it. A private repository on GitHub Free has no
# branch protection: there aidk merge reads this check before it merges, and nothing else enforces it.
name: aidk-checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  aidk-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 .aidk/ci/aidk_checks.py
