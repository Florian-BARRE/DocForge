# ============================================================================
# Release workflow for the DocForge DOCKER IMAGES → GitHub Container Registry (GHCR).
#
# `workflow_call`-ONLY: this file has no `on: push: tags:` of its own — it is fanned out to by
# release.yml (the release orchestrator), which runs the shared quality gate EXACTLY ONCE per tag
# and then calls this file with `needs: gate`. So a tag on a broken tree never reaches here at all.
# Kept as its own file (not inlined into release.yml) on purpose — see release.yml's header.
#
# Pushing goes to GHCR via the built-in GITHUB_TOKEN (packages: write) — NO stored secret.
#
# ---------------------------------------------------------------------------
# WHAT IT PUBLISHES (on tag `v1.2.3`, owner `<owner>`):
#   ghcr.io/<owner>/docforge-app:1.2.3        + :latest              (CPU only, bundles the UI, no torch)
#   ghcr.io/<owner>/docforge-mcp:1.2.3        + :latest              (CPU only, no torch)
#   ghcr.io/<owner>/docforge-worker:1.2.3-cpu     :latest-cpu
#   ghcr.io/<owner>/docforge-worker:1.2.3-gpu     :latest-gpu        (TORCH_VARIANT build-arg)
#   ghcr.io/<owner>/docforge-bge-server:1.2.3-cpu :latest-cpu
#   ghcr.io/<owner>/docforge-bge-server:1.2.3-gpu :latest-gpu        (TORCH_VARIANT build-arg)
#   ghcr.io/<owner>/docforge-paddle-server:1.2.3-cpu :latest-cpu
#   ghcr.io/<owner>/docforge-paddle-server:1.2.3-gpu :latest-gpu
#
# `:latest<suffix>` is moved ONLY by the `promote-latest` job, which `needs: images` (the whole
# matrix, `fail-fast: false`) — so a single image failing to build/push leaves ALL `:latest<suffix>`
# tags pointing at the previous good release, never a half-updated set. The immutable `<version>`
# tags are still pushed per-leg by the matrix regardless (so a partial failure is diagnosable and
# re-runnable), only the mutable "this is the current release" pointer waits for full green. See
# that job's own comment for the residual window this does NOT close.
#
# HOW TO RELEASE: see release.yml (the orchestrator) — `git tag v1.2.3 && git push origin v1.2.3`.
#
# After every push, a `security-scan` job runs Trivy against what was just published — see that
# job's own header comment for what it covers and why it's non-blocking.
# ============================================================================

name: release-images

on:
  workflow_call:

# Declaring `permissions:` sets every UNLISTED scope to `none`, so both are required here:
permissions:
  contents: read # actions/checkout must read the (private) repo
  packages: write # GHCR push via the built-in GITHUB_TOKEN

jobs:
  # 1. Fail fast if the pushed tag disagrees with the tree's declared version, BEFORE the build
  #     matrix moves any mutable :latest tag. Without this a `git tag v0.14.0` on a tree still at
  #     0.13.0 (the gate only checks the three version sources agree with EACH OTHER, not with the
  #     tag) would publish all 8 images tagged 0.14.0 + latest while containing 0.13.0 code, then the
  #     SDK release's own guard would fail — leaving GHCR and PyPI diverged with image tags that lie.
  #     Mirrors release-sdk.yml's guard.
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify tag matches the declared version
        run: |
          set -euo pipefail
          pkg_version="$(grep -oP '^version\s*=\s*"\K[^"]+' src/docforge/pyproject.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Declared version: ${pkg_version}"
          echo "Tag version:      ${tag_version}"
          if [ "${pkg_version}" != "${tag_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match src/docforge/pyproject.toml version ${pkg_version}"
            exit 1
          fi

  # 2. Build + push every image, ONLY after the tag matches the version (the gate itself already
  #    ran upstream, in release.yml, before this whole file was even called).
  images:
    needs: version-guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Explicit include (not a cross-product): app/mcp have no torch variant and no suffix,
        # while worker/bge-server ship both a CPU and a GPU build via the TORCH_VARIANT arg.
        # `file` is the REPO-RELATIVE Dockerfile path (context differs from the file's location).
        include:
          - { name: app,        context: src/docforge, file: src/docforge/app/Dockerfile,        torch: "",    suffix: "" }
          - { name: mcp,        context: src,          file: src/mcp/Dockerfile,                  torch: "",    suffix: "" }
          - { name: worker,     context: src/docforge, file: src/docforge/worker/Dockerfile,      torch: cpu,   suffix: "-cpu" }
          - { name: worker,     context: src/docforge, file: src/docforge/worker/Dockerfile,      torch: gpu,   suffix: "-gpu" }
          - { name: bge-server, context: src,          file: src/bge_server/Dockerfile,           torch: cpu,   suffix: "-cpu" }
          - { name: bge-server, context: src,          file: src/bge_server/Dockerfile,           torch: gpu,   suffix: "-gpu" }
          - { name: paddle-server, context: src,       file: src/paddle_server/Dockerfile,        torch: cpu,   suffix: "-cpu" }
          - { name: paddle-server, context: src,       file: src/paddle_server/Dockerfile,        torch: gpu,   suffix: "-gpu" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image version from the tag
        # Strip the leading `v` so tag `v1.2.3` → version `1.2.3` (mirrors release-sdk.yml's
        # `${GITHUB_REF_NAME#sdk-v}` tag→version extraction).
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/docforge-${{ matrix.name }}
          # ONLY the immutable version tag here — `latest<suffix>` is intentionally NOT pushed by
          # this step. It's moved by the `promote-latest` job below, once the WHOLE matrix is
          # green, so a single image failing never leaves `latest<suffix>` half-updated. See
          # `promote-latest`'s comment.
          tags: |
            type=raw,value=${{ env.VERSION }}${{ matrix.suffix }}

      - name: Free up runner disk (GPU only)
        # The CUDA images (~8.5 GB) + their build layers overflow the ~14 GB free on a stock
        # ubuntu-latest runner, which kills the build mid-export (unretrievable logs). Reclaim
        # ~30 GB by dropping preinstalled toolchains this build never uses. CPU builds are small
        # and skip this. See docker/build-push-action GPU-image disk-pressure notes.
        if: matrix.torch == 'gpu'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          sudo docker image prune --all --force || true
          df -h /

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only pass TORCH_VARIANT for the images that declare it (worker, bge-server);
          # app/mcp have no such ARG, so their build-args stay empty.
          build-args: ${{ matrix.torch && format('TORCH_VARIANT={0}', matrix.torch) || '' }}
          # GHA layer cache for the small images only. The GPU builds (CUDA torch, ~8.5 GB) blow past
          # the 10 GB per-repo GHA cache limit — mode=max there corrupts the cache export and fails the
          # build with Azure "BlobNotFound" — so caching is disabled for the gpu variant (empty = off).
          # Per-entry scope keeps the cpu/gpu builds of the same image from clobbering each other.
          cache-from: ${{ matrix.torch != 'gpu' && format('type=gha,scope={0}{1}', matrix.name, matrix.suffix) || '' }}
          cache-to: ${{ matrix.torch != 'gpu' && format('type=gha,mode=max,scope={0}{1}', matrix.name, matrix.suffix) || '' }}

  # 3. Move `latest<suffix>` to the version just published — ONLY once EVERY leg of the `images`
  #    matrix above has succeeded. `needs: images` with the matrix's `fail-fast: false` means: if
  #    any single leg fails, the `images` job's overall conclusion is failure, so this job is
  #    skipped entirely and every `latest<suffix>` tag is left exactly where the previous good
  #    release put it — no half-updated "latest" set. `docker buildx imagetools create` does a
  #    registry-side manifest copy (no rebuild, no pull/push of layers), so this is fast and cheap.
  #    RESIDUAL WINDOW (not closed by this job, and not worth closing here — see the finding this
  #    fixes): a crash mid-way THROUGH this job's own matrix could still leave some `latest<suffix>`
  #    tags moved and others not, if some legs of this small metadata-only job finish before a
  #    later one fails. That window is far smaller (a manifest copy, not a multi-GB image build)
  #    and re-running this job alone (after the underlying cause is fixed) is a safe, idempotent fix
  #    — an actual atomic multi-tag transaction is not something GHCR offers, so this is the
  #    intentionally-simple stopping point.
  promote-latest:
    name: promote latest${{ matrix.suffix }} (${{ matrix.name }})
    needs: images
    runs-on: ubuntu-latest
    strategy:
      # `false` so one image's registry hiccup doesn't block promoting the rest — each leg is an
      # independent, idempotent manifest copy (safe to re-run individually if it fails).
      fail-fast: false
      matrix:
        # Mirrors the `images` matrix's `name`/`suffix` pairs exactly (kept as a literal second
        # copy — GitHub Actions has no clean way to share a matrix definition across jobs).
        include:
          - { name: app,           suffix: "" }
          - { name: mcp,           suffix: "" }
          - { name: worker,        suffix: "-cpu" }
          - { name: worker,        suffix: "-gpu" }
          - { name: bge-server,    suffix: "-cpu" }
          - { name: bge-server,    suffix: "-gpu" }
          - { name: paddle-server, suffix: "-cpu" }
          - { name: paddle-server, suffix: "-gpu" }
    steps:
      - name: Derive image version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        # `docker buildx imagetools` needs a builder instance even though it never builds anything.
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest${{ matrix.suffix }} → ${{ env.VERSION }}${{ matrix.suffix }} (registry-side manifest copy)
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/docforge-${{ matrix.name }}"
          docker buildx imagetools create \
            --tag "${image}:latest${{ matrix.suffix }}" \
            "${image}:${{ env.VERSION }}${{ matrix.suffix }}"

  # 4. Non-blocking vulnerability scan of what was just published (after push, so it scans the
  #    real pushed artifact, not a throwaway local build). A full IMAGE scan is only cheap for the
  #    two small, single-variant images (app/mcp — no torch, always built, no GPU sibling); the
  #    other three (worker/bge-server/paddle-server) ship huge CUDA -gpu variants (and their -cpu
  #    siblings still carry sizeable ML deps), so pulling+unpacking them here would be slow. Those
  #    instead get a cheap FILESYSTEM scan of their dependency manifests (uv.lock) — still catches
  #    known-vulnerable dependency versions, without ever pulling an image. Day-0 baseline is
  #    unvetted, so every step is non-blocking (`exit-code: 0` + `continue-on-error`): a brand-new
  #    scanner must never be able to block a release. Flip to blocking once the baseline CVE list
  #    has been triaged (see docs/PROD-HARDENING.md or a follow-up ADR).
  security-scan:
    name: security-scan (Trivy, non-blocking)
    needs: images
    runs-on: ubuntu-latest
    # Job-level guard: the scan must NEVER fail a release. step-level continue-on-error cannot
    # catch a "Set up job" failure (e.g. an unresolvable action ref), so mark the whole job
    # non-blocking too — the release is judged solely on the image build+push jobs above.
    continue-on-error: true
    permissions:
      contents: read # actions/checkout
      packages: read # pull the just-pushed app/mcp images from GHCR for scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Log in to GHCR (pull for scanning)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan app image (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/docforge-app:${{ env.VERSION }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-app.txt

      - name: Scan mcp image (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/docforge-mcp:${{ env.VERSION }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-mcp.txt

      - name: Scan docforge deps — filesystem (covers app + worker, one shared uv.lock)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: src/docforge
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-docforge-deps.txt

      - name: Scan bge_server deps — filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: src/bge_server
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-bge-server-deps.txt

      - name: Scan paddle_server deps — filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: src/paddle_server
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          output: trivy-paddle-server-deps.txt

      - name: Publish scan reports to the job summary
        if: always()
        run: |
          shopt -s nullglob
          for f in trivy-*.txt; do
            {
              echo "## $f"
              echo '```'
              cat "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload scan reports as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-*.txt
          retention-days: 30
