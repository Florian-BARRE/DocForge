# CI — runs the full quality gate on every push + PR, so "the suite is green" never depends on a
# manual local run. The gate itself (format + lint + type-check + unit tests for every package,
# frontend build, SDK↔backend OpenAPI coherence) lives in the reusable gate.yml, shared verbatim
# with the release workflow — so what merges and what publishes are held to the EXACT same bar.
#
# Note: `push: branches` matches branch pushes only, NOT tag pushes, so this CI never runs on a
# release tag. A `v*`/`sdk-v*` tag is handled by the release workflows, which run this same gate
# before publishing. (A unified `v*` tag does trigger release-images.yml AND release-sdk.yml, so the
# shared gate runs twice for that tag — a known duplication tracked for de-duplication, harmless
# beyond the extra minutes.)

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least-privilege floor: this workflow only ever calls the reusable gate, which itself only needs
# to check out the repo. No job here needs anything beyond that.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
