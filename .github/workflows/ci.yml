# CI gate — runs on every push + PR so "the suite is green" never depends on a manual local run.
# This is a monorepo of FOUR standalone uv projects (docforge-rework, docforge_sdk, mcp, bge_server),
# each with its own pyproject/uv.lock/ruff-mypy config. Every package is gated here — no exceptions —
# because this is a public, production repo. All unit suites are fully mocked/serviceless (lazy store
# connections), so no service containers or docker builds are needed anywhere in this workflow, and
# no `-m live` test (which needs a running API) is ever run in CI.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docforge-rework:
    # The v2 graph engine + app/worker. Deps-only project (no mypy dev dep here by design — ruff is
    # the enforced linter for this package) — see its pyproject.toml comment.
    name: docforge-rework — ruff + unit suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/docforge-rework
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Unit suite
        # Serviceless: units mock every store. The real-OCR test auto-skips without the worker
        # group (pillow/rapidocr absent) — run it locally with `uv sync --group worker` when needed.
        run: uv run pytest tests/units -q

  python-packages:
    # Uniform gate for the two "normal" standalone Python packages: ruff + mypy + pytest, no heavy
    # ML deps. Matrixed because the three commands are identical modulo working directory / mypy
    # target / pytest args — a single job definition avoids duplicating five near-identical steps.
    name: ${{ matrix.name }} — ruff + mypy + unit suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docforge_sdk
            working-directory: src/docforge_sdk
            mypy-target: "--strict docforge_sdk"
            pytest-args: -q -m "not live"
          - name: mcp
            # mcp depends on docforge_sdk via a `[tool.uv.sources]` path source (../docforge_sdk);
            # both live in the same checkout, so `uv sync --frozen` resolves it without extra steps.
            working-directory: src/mcp
            mypy-target: "."
            pytest-args: -q
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (type check)
        run: uv run mypy ${{ matrix.mypy-target }}

      - name: Unit suite
        run: uv run pytest ${{ matrix.pytest-args }}

  bge-server:
    # Kept as its own job (not folded into the matrix above) because of its ML dependency cost.
    # FlagEmbedding is a HARD dependency of this package, and it unconditionally pulls torch — a
    # plain `uv sync` with no extra selected resolves torch straight from PyPI, which bundles the
    # full CUDA runtime (nvidia-cublas/cudnn/nccl/... ~5 GB total). The `cpu` extra steers uv's
    # torch source to the dedicated pytorch-cpu wheel index instead (~200 MB, no CUDA payload) —
    # always pass it here. The unit suite itself is fully mocked (no torch/FlagEmbedding import at
    # test time, see tests/unit/test_batching.py's header comment), so torch is a sync-time cost
    # only, never an import-time one.
    name: bge_server — ruff + mypy + unit suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/bge_server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies (locked, CPU torch)
        run: uv sync --frozen --extra cpu

      # `uv run` re-syncs the project environment before each invocation, and without an explicit
      # extra it re-resolves to the DEFAULT (non-extra) branch — silently swapping the CPU torch
      # back out for the full CUDA build. `--no-sync` pins every subsequent step to the environment
      # exactly as synced above.
      - name: Ruff (lint)
        run: uv run --no-sync ruff check .

      - name: Mypy (type check)
        run: uv run --no-sync mypy .

      - name: Unit suite
        run: uv run --no-sync pytest -q

  frontend:
    name: Frontend — tsc + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/docforge-rework/app/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/docforge-rework/app/frontend/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Build (tsc --noEmit && vite build)
        run: npm run build

  sdk-parity:
    # Coherence gate: the docforge-sdk models + committed OpenAPI snapshot MUST match the backend's
    # CURRENT schema. If a backend router model changes without the SDK being updated, this job goes
    # RED — SDK/backend drift can never merge silently. The backend openapi is produced serviceless
    # (FastAPI .openapi() only introspects routes; the app's store clients connect lazily), so no
    # service containers are needed. Placeholder config comes from the committed .env.example. The
    # SDK's own ruff/mypy/pytest gate lives in the python-packages matrix job above — this job only
    # covers the drift check itself, to avoid duplicating that work.
    name: SDK — OpenAPI parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Dump the backend's current OpenAPI (serviceless)
        working-directory: src/docforge-rework
        env:
          # Console/file sinks off so stdout stays pure JSON; the rest are placeholders — nothing
          # connects during .openapi() introspection.
          LOGGING_ENABLE_CONSOLE: "false"
          LOGGING_ENABLE_FILE: "false"
        run: |
          set -a; grep -vE '^\s*#|^\s*$' ../../services/docforge-rework/.env.example > /tmp/ci.env; . /tmp/ci.env; set +a
          export LOGGING_ENABLE_CONSOLE=false LOGGING_ENABLE_FILE=false
          uv sync --frozen
          uv run python app/scripts/dump_openapi.py > /tmp/current_openapi.json
          python -c "import json; print('schemas:', len(json.load(open('/tmp/current_openapi.json'))['components']['schemas']))"

      - name: Fail on SDK↔backend schema drift
        working-directory: src/docforge_sdk
        run: |
          uv sync --frozen
          uv run python tests/check_schema_drift.py /tmp/current_openapi.json
