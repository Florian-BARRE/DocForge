# ============================================================================
# Dependabot — automated dependency updates.
#
# One entry per ecosystem x directory that actually holds a manifest Dependabot can parse:
#   - github-actions : action versions pinned in .github/workflows/*.yml
#   - uv             : each of the 7 independent Python projects in this monorepo (own
#                       pyproject.toml + uv.lock — mirrors the gate.yml job split)
#   - npm            : the frontend (package.json + package-lock.json)
#   - docker         : base images in each Dockerfile (FROM lines), one entry per directory
#                       that holds a Dockerfile — matches the release-sdk.yml `images` build matrix
#   - docker-compose : the pinned service images (postgres/redis/qdrant/seaweedfs/gotenberg,
#                       and the telemetry/proxy stacks) declared as `image:` in the compose files
#
# Every Python/npm group collapses minor+patch bumps into a single weekly PR to keep noise
# down; majors still open their own PR (deliberately not grouped — those need a human look).
#
# ── COMPOSE IMAGE PIN COVERAGE — ACTIVE ─────────────────────────────────────
# Dependabot's docker-compose scanner only matches files whose NAME fits the glob
# `(docker-)?compose(?>\.[\w-]+)?\.ya?ml` (e.g. docker-compose.yml, compose.prod.yml). This
# repo's compose files used to use bare scenario names — `compose/base.yml`, `compose/overlays/
# {gpu,dev,proxy,telemetry}.yml`, `compose/{prod,dev}-{cpu,gpu}.yml` — which did NOT match that
# glob. They have since been renamed to `compose.*.yml` (e.g. `compose/compose.base.yml`,
# `compose/overlays/compose.gpu.yml`, `compose/compose.prod-cpu.yml`) specifically so every file
# fits the glob, so the third-party `image:` pins living inside them (each `name:tag@sha256:digest`:
# postgres, redis, qdrant/qdrant, chrislusf/seaweedfs, gotenberg/gotenberg, prom/prometheus,
# grafana/{loki,promtail,grafana}, caddy, node) ARE now auto-updated, via the `/compose` and
# `/compose/overlays` entries below (plus the root `docker-compose.yml`, which is a pure `include:`
# with no image pins of its own). postgres, redis and seaweedfs mirror the shared production
# services (postgres 16, redis 7.4, seaweedfs 4.38): the `/compose` entry holds them there. The GHCR `ghcr.io/florian-barre/docforge-*`
# images are first-party (released by release-sdk.yml's `images` job) and are deliberately NOT
# tracked here.
# ============================================================================

version: 2

# Private/extra package indexes the resolver must reach. Dependabot's proxy only lets a job through
# to the registries listed here (plus the public ones): without this, every `uv /src/paddle_server`
# update failed with "paddlepaddle-gpu was not found in the package registry" (egress refused).
registries:
  # Paddle's CUDA 12.6 wheel index — the `paddle-cu126` [[tool.uv.index]] of
  # src/paddle_server/pyproject.toml. Public, no credentials. Keep the url in sync with that index.
  paddle-cu126:
    type: python-index
    url: "https://www.paddlepaddle.org.cn/packages/stable/cu126/"

updates:
  # --- GitHub Actions (workflow files under .github/workflows/) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # --- Python projects (uv-managed: pyproject.toml + uv.lock) ---
  - package-ecosystem: "uv"
    directory: "/src/docforge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docforge-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # transformers is pinned <5 on purpose (pyproject.toml, `worker` group): 5.x breaks
      # docling's AutoProcessor use. Lift when docling supports transformers 5.
      - dependency-name: "transformers"
        versions: [">=5"]
      # torch/torchvision are capped in [tool.uv] constraint-dependencies (torch<2.14,
      # torchvision<0.29): cu126, the last CUDA index with sm_70 kernels for the prod V100, stops
      # at torch 2.13. Dependabot does not read uv constraints, so the bump is unresolvable and
      # turns the whole run red. Lift together with the cap (when the prod GPU moves off Volta).
      - dependency-name: "torch"
        versions: [">=2.14"]
      - dependency-name: "torchvision"
        versions: [">=0.29"]

  - package-ecosystem: "uv"
    directory: "/src/docforge_sdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docforge-sdk-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/src/mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      mcp-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/src/bge_server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      bge-server-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # torch is capped in [tool.uv] constraint-dependencies (torch<2.14): cu126, the last CUDA
      # index with sm_70 kernels for the prod V100, stops at torch 2.13. Dependabot does not read
      # uv constraints, so the bump is unresolvable and turns the whole run red. Lift with the cap.
      # (No torchvision here: bge_server does not depend on it.)
      - dependency-name: "torch"
        versions: [">=2.14"]
      # transformers is pinned <5 (pyproject.toml): FlagEmbedding's FlagReranker calls the
      # slow-tokenizer `prepare_for_model`, removed in 5.x (/rerank breaks). Lift when FlagEmbedding
      # ships a reranker compatible with transformers 5.
      - dependency-name: "transformers"
        versions: [">=5"]
      # huggingface-hub is pinned <1 (pyproject.toml): imported directly by
      # libs/bge_models/revision.py, and the hub 1.x line comes with transformers 5. Lift with the
      # transformers rule above.
      - dependency-name: "huggingface-hub"
        versions: [">=1"]

  - package-ecosystem: "uv"
    directory: "/src/paddle_server"
    # Paddle's GPU index (top-level `registries`): the resolver needs it for paddlepaddle-gpu.
    registries:
      - paddle-cu126
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      paddle-server-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # configplusplus 0.4 needs pyyaml>=6.0.3 while paddlex 3.7.2 pins pyyaml==6.0.2: the bump is
      # unresolvable. Lift when paddlex relaxes its pyyaml pin.
      - dependency-name: "configplusplus"
        versions: [">=0.4"]

  - package-ecosystem: "uv"
    directory: "/src/mineru_server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      mineru-server-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # torch/torchvision are pinned ==2.13.0/==0.28.0 in the cpu/gpu extras (pyproject.toml): cu126,
      # the last CUDA index with sm_70 kernels for the prod V100, stops at torch 2.13, and the pair
      # matches bge_server and the docforge worker. Lift with their caps (prod GPU off Volta).
      - dependency-name: "torch"
        versions: [">=2.14"]
      - dependency-name: "torchvision"
        versions: [">=0.29"]
      # mineru is pinned <3 (pyproject.toml): the 3.x line is a major to plan separately (its own
      # request), not a weekly bump (#194 and #215 closed). Lift when that move is planned.
      - dependency-name: "mineru"
        versions: [">=3"]

  - package-ecosystem: "uv"
    directory: "/src/dots_ocr_server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dots-ocr-server-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # torch/torchvision are capped (torch<2.14, torchvision<0.29): cu126, the last CUDA index with
      # sm_70 kernels for the prod V100, stops at torch 2.13. Lift with the cap.
      - dependency-name: "torch"
        versions: [">=2.14"]
      - dependency-name: "torchvision"
        versions: [">=0.29"]
      # transformers is pinned ==4.56.1 (pyproject.toml, `gpu` extra): dots.ocr's remote-code
      # processor omits video_processor, a required argument since transformers 4.57 (TypeError at
      # load). So >=4.57 (and the 5.x line with it) is held. Lift when dots.ocr supports a newer one.
      - dependency-name: "transformers"
        versions: [">=4.57"]

  # --- Frontend (npm: package.json + package-lock.json) ---
  - package-ecosystem: "npm"
    directory: "/src/docforge/app/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @tanstack/react-table 9 is a rewrite of the corpus grid, not a bump (142 tsc errors in
      # src/features/corpus/: useReactTable, getCoreRowModel and the column APIs moved to a feature
      # registry). v8 is maintained and works with React 19. Lift when the grid migration is planned.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]

  # --- Docker base images (one entry per directory containing a Dockerfile) ---
  - package-ecosystem: "docker"
    directory: "/src/docforge/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # python 3.12 -> 3.x is a semver-minor tag bump (3.12 -> 3.15). The venv is built in the
      # ghcr.io/astral-sh/uv:python3.12 stage and copied into this runtime, so bumping the
      # runtime alone breaks the image. Lift when both stages are moved together by hand.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # node majors (odd = non-LTS, e.g. 25) are never auto-proposed: the move to the next LTS
      # is done by hand (Dockerfile ui-build stage + compose.dev.yml together). Keep for good.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/src/docforge/worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # python 3.12 -> 3.x is a semver-minor tag bump (3.12 -> 3.15). The venv is built in the
      # ghcr.io/astral-sh/uv:python3.12 stage and copied into this runtime, so bumping the
      # runtime alone breaks the image. Lift when both stages are moved together by hand.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/src/mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # python 3.12 -> 3.x is a semver-minor tag bump (3.12 -> 3.15). The venv is built in the
      # ghcr.io/astral-sh/uv:python3.12 stage and copied into this runtime, so bumping the
      # runtime alone breaks the image. Lift when both stages are moved together by hand.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/src/bge_server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # python 3.12 -> 3.x is a semver-minor tag bump (3.12 -> 3.15). The venv is built in the
      # ghcr.io/astral-sh/uv:python3.12 stage and copied into this runtime, so bumping the
      # runtime alone breaks the image. Lift when both stages are moved together by hand.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/src/paddle_server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # python 3.12 -> 3.x is a semver-minor tag bump (3.12 -> 3.15). The venv is built in the
      # ghcr.io/astral-sh/uv:python3.12 stage and copied into this runtime, so bumping the
      # runtime alone breaks the image. Lift when both stages are moved together by hand.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/src/mineru_server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # python 3.12 -> 3.x is a semver-minor tag bump (3.12 -> 3.15). The venv is built in the
      # ghcr.io/astral-sh/uv:python3.12 stage and copied into this runtime, so bumping the
      # runtime alone breaks the image. Lift when both stages are moved together by hand.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker"
    directory: "/src/dots_ocr_server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # python 3.12 -> 3.x is a semver-minor tag bump (3.12 -> 3.15). The venv is built in the
      # ghcr.io/astral-sh/uv:python3.12 stage and copied into this runtime, so bumping the
      # runtime alone breaks the image. Lift when both stages are moved together by hand.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # --- Docker Compose service images (`image:` pins in the compose files) ---
  # See the header note: every compose file now fits the `compose.*.yml` glob, so the root
  # docker-compose.yml plus the /compose and /compose/overlays entries below all get scanned.
  # Grouped like every other ecosystem.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compose-images-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker-compose"
    directory: "/compose"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compose-images-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # postgres, redis and seaweedfs (compose.base.yml): mirrors the shared production service;
      # change only when prod changes (prod runs postgres 16, redis 7, seaweedfs 4.38).
      - dependency-name: "postgres"
        versions: [">=17"]
      - dependency-name: "redis"
        versions: [">=7.5"]
      - dependency-name: "chrislusf/seaweedfs"
        versions: [">4.38"]

  - package-ecosystem: "docker-compose"
    directory: "/compose/overlays"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compose-images-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Same node rule as the /src/docforge/app docker entry (compose.dev.yml runs the same
      # node:22 image as the Dockerfile's ui-build stage): the LTS move is done by hand.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
