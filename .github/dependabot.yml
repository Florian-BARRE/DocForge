# ============================================================================
# Dependabot — automated dependency updates.
#
# One entry per ecosystem x directory that actually holds a manifest Dependabot can parse:
#   - github-actions : action versions pinned in .github/workflows/*.yml
#   - uv             : each of the 5 independent Python projects in this monorepo (own
#                       pyproject.toml + uv.lock — mirrors the gate.yml job split)
#   - npm            : the frontend (package.json + package-lock.json)
#   - docker         : base images in each Dockerfile (FROM lines), one entry per directory
#                       that holds a Dockerfile — matches the release-images.yml build matrix
#   - docker-compose : the pinned service images (postgres/redis/qdrant/seaweedfs/gotenberg,
#                       and the telemetry/proxy stacks) declared as `image:` in the compose files
#
# Every Python/npm group collapses minor+patch bumps into a single weekly PR to keep noise
# down; majors still open their own PR (deliberately not grouped — those need a human look).
#
# ── KNOWN LIMITATION (compose image pins) ──────────────────────────────────
# Dependabot's docker-compose scanner only matches files whose NAME fits the glob
# `(docker-)?compose(?>\.[\w-]+)?\.ya?ml` (e.g. docker-compose.yml, compose.prod.yml). This
# repo's compose files use scenario names — `compose/base.yml`, `compose/overlays/*.yml`,
# `compose/{prod,dev}-{cpu,gpu}.yml` — which do NOT match that glob, so the ~11 third-party
# `image:` pins living inside them (postgres:16-bookworm, redis:7-bookworm, qdrant/qdrant,
# chrislusf/seaweedfs, gotenberg/gotenberg:8, prom/prometheus, grafana/{loki,promtail,grafana},
# caddy, node:22-bookworm-slim) are NOT auto-updated today. The only conventionally-named file
# is the root `docker-compose.yml`, which is a pure `include:` (no image pins). The entries below
# cover it and are staged over the compose dirs so they take effect the moment a file is renamed
# to the recognised form; until then those pins need a rename or manual tracking. The GHCR
# `ghcr.io/florian-barre/docforge-*` images are first-party (released by release-images.yml) and
# are deliberately NOT tracked here.
# ============================================================================

version: 2
updates:
  # --- GitHub Actions (workflow files under .github/workflows/) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # --- Python projects (uv-managed: pyproject.toml + uv.lock) ---
  - package-ecosystem: "uv"
    directory: "/src/docforge"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docforge-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/src/docforge_sdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docforge-sdk-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/src/mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      mcp-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/src/bge_server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      bge-server-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/src/paddle_server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      paddle-server-minor-patch:
        update-types: ["minor", "patch"]

  # --- Frontend (npm: package.json + package-lock.json) ---
  - package-ecosystem: "npm"
    directory: "/src/docforge/app/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]

  # --- Docker base images (one entry per directory containing a Dockerfile) ---
  - package-ecosystem: "docker"
    directory: "/src/docforge/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/src/docforge/worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/src/mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/src/bge_server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/src/paddle_server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # --- Docker Compose service images (`image:` pins in the compose files) ---
  # See the KNOWN LIMITATION note in the header: only the root standard-named docker-compose.yml
  # is matched by the scanner today; the /compose entries are staged for when a scenario file is
  # renamed to the recognised `compose.*.yml` form. Grouped like every other ecosystem.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compose-images-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker-compose"
    directory: "/compose"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compose-images-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker-compose"
    directory: "/compose/overlays"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compose-images-minor-patch:
        update-types: ["minor", "patch"]
