# AI Dev Kit: what aidk verify checks before a task is declared done (agents and the Stop hook).
# Each check is the command as a list of arguments, run from the repository root, in this order.
# The CI gate's commands (.github/workflows/gate.yml, run by ci.yml and by release-sdk.yml's gate), job by
# job: docforge, docforge_sdk, mcp, bge_server, paddle_server (CPU wheels, then never re-synced), frontend,
# sdk-parity; then ci.yml's secrets job. env_from below plays the gate's
# `cp services/docforge/.env.example services/docforge/.env` (placeholder config, nothing is dialed).
# Beyond the CI: mineru_server and dots_ocr_server (format, lint, tests on the base sync: their engines are
# GPU extras the pure code does not need).
# Beyond the CI too: the *-lock checks (uv lock --check per uv project); gate.yml has none yet (florian's).
# Left to the CI, on purpose:
# - gate.yml db-tests: a real Postgres service (tests/db, -m db, TEST_POSTGRES_*), not a worktree's.
# - gate.yml docker-build: 7 multi-GB image builds (torch, paddle), far over a check's timeout.
# - release-sdk.yml version-guard, images, publish, security-scan: on a pushed tag only (tests/units'
#   test_version_alignment.py keeps the three versions in lockstep locally).
# - retrieval-quality.yml: workflow_dispatch only, ingests a corpus through the whole dev-cpu stack with bge.
# - aidk-checks.yml: the kit's drift rules, which aidk verify itself runs before these checks.
# - live tests (-m live): a running stack.

[project]
kind = "code"    # code, docs or research: docs and research need no tests rule, their checks are optional

[checks]
# Each uv project's uv.lock matches its pyproject.toml (uv sync --frozen would install a stale lock silently).
docforge-lock = ["uv", "lock", "--check", "--directory", "src/docforge"]
docforge-deps = ["uv", "sync", "--frozen", "--directory", "src/docforge"]
docforge-format = ["uv", "run", "--frozen", "--directory", "src/docforge", "ruff", "format", "--check", "."]
docforge-lint = ["uv", "run", "--frozen", "--directory", "src/docforge", "ruff", "check", "."]
docforge-tests = ["uv", "run", "--frozen", "--directory", "src/docforge", "pytest", "tests/units", "-q", "--cov=app", "--cov=worker", "--cov=shared", "--cov-report=term-missing"]
docforge-rag-eval = ["uv", "run", "--frozen", "--directory", "src/docforge", "python", "-m", "pytest", "tests/rag_eval", "-q", "-m", "not live"]
sdk-lock = ["uv", "lock", "--check", "--directory", "src/docforge_sdk"]
sdk-deps = ["uv", "sync", "--frozen", "--directory", "src/docforge_sdk"]
sdk-format = ["uv", "run", "--frozen", "--directory", "src/docforge_sdk", "ruff", "format", "--check", "."]
sdk-lint = ["uv", "run", "--frozen", "--directory", "src/docforge_sdk", "ruff", "check", "."]
sdk-types = ["uv", "run", "--frozen", "--directory", "src/docforge_sdk", "mypy", "--strict", "docforge_sdk"]
sdk-tests = ["uv", "run", "--frozen", "--directory", "src/docforge_sdk", "pytest", "-q", "-m", "not live"]
mcp-lock = ["uv", "lock", "--check", "--directory", "src/mcp"]
mcp-deps = ["uv", "sync", "--frozen", "--directory", "src/mcp"]
mcp-format = ["uv", "run", "--frozen", "--directory", "src/mcp", "ruff", "format", "--check", "."]
mcp-lint = ["uv", "run", "--frozen", "--directory", "src/mcp", "ruff", "check", "."]
mcp-types = ["uv", "run", "--frozen", "--directory", "src/mcp", "mypy", "."]
mcp-tests = ["uv", "run", "--frozen", "--directory", "src/mcp", "pytest", "-q"]
bge-lock = ["uv", "lock", "--check", "--directory", "src/bge_server"]
bge-deps = ["uv", "sync", "--frozen", "--directory", "src/bge_server", "--extra", "cpu"]
bge-format = ["uv", "run", "--no-sync", "--directory", "src/bge_server", "ruff", "format", "--check", "."]
bge-lint = ["uv", "run", "--no-sync", "--directory", "src/bge_server", "ruff", "check", "."]
bge-types = ["uv", "run", "--no-sync", "--directory", "src/bge_server", "mypy", "."]
bge-tests = ["uv", "run", "--no-sync", "--directory", "src/bge_server", "pytest", "-q"]
paddle-lock = ["uv", "lock", "--check", "--directory", "src/paddle_server"]
paddle-deps = ["uv", "sync", "--frozen", "--directory", "src/paddle_server", "--extra", "cpu"]
paddle-format = ["uv", "run", "--no-sync", "--directory", "src/paddle_server", "ruff", "format", "--check", "."]
paddle-lint = ["uv", "run", "--no-sync", "--directory", "src/paddle_server", "ruff", "check", "."]
paddle-types = ["uv", "run", "--no-sync", "--directory", "src/paddle_server", "mypy", "."]
paddle-tests = ["uv", "run", "--no-sync", "--directory", "src/paddle_server", "pytest", "-q"]
mineru-lock = ["uv", "lock", "--check", "--directory", "src/mineru_server"]
mineru-deps = ["uv", "sync", "--frozen", "--directory", "src/mineru_server"]
mineru-format = ["uv", "run", "--frozen", "--directory", "src/mineru_server", "ruff", "format", "--check", "."]
mineru-lint = ["uv", "run", "--frozen", "--directory", "src/mineru_server", "ruff", "check", "."]
mineru-types = ["uv", "run", "--frozen", "--directory", "src/mineru_server", "mypy", "."]
mineru-tests = ["uv", "run", "--frozen", "--directory", "src/mineru_server", "pytest", "-q"]
dots-ocr-lock = ["uv", "lock", "--check", "--directory", "src/dots_ocr_server"]
dots-ocr-deps = ["uv", "sync", "--frozen", "--directory", "src/dots_ocr_server"]
dots-ocr-format = ["uv", "run", "--frozen", "--directory", "src/dots_ocr_server", "ruff", "format", "--check", "."]
dots-ocr-lint = ["uv", "run", "--frozen", "--directory", "src/dots_ocr_server", "ruff", "check", "."]
dots-ocr-types = ["uv", "run", "--frozen", "--directory", "src/dots_ocr_server", "mypy", "."]
dots-ocr-tests = ["uv", "run", "--frozen", "--directory", "src/dots_ocr_server", "pytest", "-q"]
frontend-deps = ["npm", "ci", "--prefix", "src/docforge/app/frontend", "--no-audit", "--no-fund"]
frontend-lint = ["npm", "--prefix", "src/docforge/app/frontend", "run", "lint"]
frontend-types = ["npm", "--prefix", "src/docforge/app/frontend", "exec", "--", "tsc", "--noEmit", "-p", "src/docforge/app/frontend"]
frontend-tests = ["npm", "--prefix", "src/docforge/app/frontend", "run", "test"]
frontend-build = ["npm", "--prefix", "src/docforge/app/frontend", "run", "build"]
# The sdk-parity job: the backend's current OpenAPI (dumped serviceless) against the SDK's models and snapshot.
sdk-parity = ["sh", "-c", "set -e; f=$(mktemp); trap 'rm -f \"$f\"' EXIT; LOGGING_ENABLE_CONSOLE=false LOGGING_ENABLE_FILE=false uv run --frozen --directory src/docforge python app/scripts/dump_openapi.py > \"$f\"; uv run --frozen --directory src/docforge_sdk python tests/check_schema_drift.py \"$f\""]
# ci.yml's secrets job: no tracked secret file (the same pattern), then gitleaks on the branch's commits when
# it is installed here (the CI downloads it; the kit's commit hook scans each commit anyway, [hooks] secrets).
secrets-files = ["sh", "-c", '''hits=$(git ls-files | grep -E '(^|/)\.env$|(^|/)[^/]*\.env$|(^|/)\.env\.worktree$|(^|/)s3_config\.json$|\.(pem|key|p12|pfx)$|(^|/)id_(rsa|ed25519|ecdsa)$' | grep -v '\.example$' || true); if [ -n "$hits" ]; then echo "Tracked secret file(s):"; echo "$hits"; exit 1; fi; echo "No tracked secret file."''']
gitleaks = ["sh", "-c", 'command -v gitleaks >/dev/null 2>&1 || { echo "gitleaks not installed: left to the CI secrets job"; exit 0; }; gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 --log-opts="origin/main..HEAD" .']

[rules]
base = "origin/main"
# A change to source files needs a change to test files (globs, relative to the repository).
# src/*_server covers bge, paddle, mineru and dots_ocr. Left out on purpose: the migrations (tests/db, CI only),
# src/docforge/app/scripts (dump_openapi.py, checked by sdk-parity), scripts/ (set_version.sh and the kit's
# dev-stack.sh, guarded by test_version_alignment.py and test_worktree_compose_overlay.py), build and config files.
source = ["src/docforge/app/backend/**", "src/docforge/app/config/**", "src/docforge/app/entrypoint.py", "src/docforge/app/frontend/src/**", "src/docforge/worker/backend/**", "src/docforge/worker/config/**", "src/docforge/worker/entrypoint.py", "src/docforge/shared/libs/**", "src/docforge_sdk/docforge_sdk/**", "src/mcp/libs/**", "src/mcp/entrypoint.py", "src/mcp/config_loader.py", "src/*_server/backend/**", "src/*_server/libs/**", "src/*_server/entrypoint.py", "src/*_server/config_loader.py"]
tests = ["src/docforge/tests/**", "src/docforge_sdk/tests/**", "src/mcp/tests/**", "src/*_server/tests/**", "src/docforge/app/frontend/src/**/*.test.ts", "src/docforge/app/frontend/src/**/*.test.tsx", "src/docforge/app/frontend/src/test/**"]
require_tests = true
timeout = 900
# The checks run with the CI's variables, never with the real environment (shared database...).
env_from = "services/docforge/.env.example"

# The kit's git hooks (every commit and every push, whatever the agent's tool): the names of [checks]
# run at each commit (keep them fast: a few seconds) and before each push.
# Measured on the dev center (2026-10-27, warm caches): pre_commit 0.2 s together (ruff, cached); pre_push
# about 76 s (docforge-tests 54 s, sdk-parity 5 s, mcp-tests 5 s, frontend-types 5 s, frontend-lint 3 s,
# sdk-tests 2 s, the rest under a second each; the seven *-lock checks 0.2 s together, 2026-10-29). bge and
# paddle stay out of both hooks but for their lock checks (no venv needed): their other checks run --no-sync
# on the CPU torch/paddle venv, which a worktree only has after aidk verify's bge-deps/paddle-deps.
[hooks]
pre_commit = ["docforge-format", "docforge-lint", "sdk-format", "sdk-lint", "mcp-format", "mcp-lint", "mineru-format", "mineru-lint", "dots-ocr-format", "dots-ocr-lint"]
pre_push = ["docforge-lock", "sdk-lock", "mcp-lock", "bge-lock", "paddle-lock", "mineru-lock", "dots-ocr-lock", "sdk-types", "sdk-tests", "mcp-types", "mcp-tests", "mineru-tests", "dots-ocr-tests", "frontend-lint", "frontend-types", "docforge-rag-eval", "sdk-parity", "secrets-files", "docforge-tests"]
commit_format = "conventional"
secrets = true
# src/docforge/uv.lock is ~1.05 MB, over the 1024 KiB default: a lock change would be refused at commit.
max_file_kb = 2048

# Never merged without florian: the CI and release, the version, the database schema, production compose, gitleaks.
[merge]
never_alone = [".github/workflows/**", ".github/dependabot.yml", "scripts/set_version.sh", "src/docforge/shared/migrations/**", "compose/compose.prod-*.yml", ".gitleaks.toml"]
# The kit no longer adopts bot PRs by default (kit #284): keep reviewing and merging Dependabot's PRs here.
bots = ["dependabot[bot]"]

# The dev stack of a worktree (scripts/dev-stack.sh: compose/compose.dev-cpu.yml + compose/overlays/compose.worktree.yml).
# Nothing starts at setup; aidk stack up NAME starts a service with what it needs (needs, and the compose
# file's depends_on: postgres, redis and seaweedfs come with the app and the worker). A service behind a
# compose profile (models, extras) starts when named.
[stack.frontend]
compose = "docforge_frontend"   # the Vite UI (hot reload), proxying the API to the app
needs = ["app"]
paths = ["src/docforge/app/frontend/**"]

[stack.app]
compose = "docforge_app"        # FastAPI backend (API docs at /scalar)
needs = ["qdrant"]              # search and previews read Qdrant (not a depends_on of the compose file)
paths = ["src/docforge/app/backend/**", "src/docforge/app/config/**", "src/docforge/app/entrypoint.py", "src/docforge/app/scripts/**", "src/docforge/app/Dockerfile", "src/docforge/shared/**", "src/docforge/pyproject.toml", "src/docforge/uv.lock"]

[stack.worker]
compose = "docforge_worker"     # arq worker: ingestion pipeline
needs = ["qdrant", "gotenberg"] # indexing writes to Qdrant; Office files convert through Gotenberg
paths = ["src/docforge/worker/**", "src/docforge/shared/**", "src/docforge/pyproject.toml", "src/docforge/uv.lock"]

[stack.mcp]
compose = "docforge_mcp"        # MCP server over the SDK (compose profile extras)
needs = ["app"]
paths = ["src/mcp/**"]

[stack.bge]
compose = "docforge_bge_server" # BGE-M3 embeddings on CPU (compose profile models: several GB of memory)
paths = ["src/bge_server/**"]

[stack.paddle]
compose = "docforge_paddle_server"  # PaddleOCR on CPU (compose profile models)
paths = ["src/paddle_server/**"]

# Not declared: docforge_mineru_server and docforge_dots_ocr_server (compose profiles mineru, dots_ocr) reserve
# a CUDA GPU this machine does not have; their pure code is covered by the mineru-* and dots-ocr-* checks.

[stack.qdrant]
compose = "docforge_qdrant"

[stack.gotenberg]
compose = "docforge_gotenberg"
