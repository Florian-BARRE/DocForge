# ─────────────────────────────────────────────────────────────────────────────
# Grafana datasource provisioning for the DocForge telemetry overlay — auto-registers
# Prometheus + Loki on startup so nobody has to click through the UI to wire them up.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: docforge-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    uid: docforge-loki
    access: proxy
    url: http://loki:3100
    editable: false
