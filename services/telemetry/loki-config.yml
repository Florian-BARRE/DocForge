# ─────────────────────────────────────────────────────────────────────────────
# Loki single-binary config for the DocForge telemetry overlay. Filesystem storage only
# (no S3/GCS) — fine for a single-host deployment; the `loki_data` named volume (see the
# overlay) persists chunks/index/rules across recreations.
# ─────────────────────────────────────────────────────────────────────────────
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Compactor also owns retention enforcement for the tsdb/filesystem combo above (no separate
# retention component in single-binary Loki). working_directory sits under the same /loki
# path_prefix as chunks/rules — i.e. the `loki_data` named volume (see the overlay) — so its
# marker/delete-request state persists across container recreations same as the chunks do.
compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true

limits_config:
  # Operator-tunable retention window — how long logs live before the compactor deletes them.
  # 168h (7 days) is a sane default for this 23 GB VM; raise/lower per how much Loki disk you
  # can spare (unbounded before this change). Loki enforces per-stream retention_period overrides
  # via `overrides:` if a specific service ever needs longer/shorter retention than the default.
  retention_period: 168h

ruler:
  alertmanager_url: http://localhost:9093
