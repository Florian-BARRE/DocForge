# ─────────────────────────────────────────────────────────────────────────────
# DocForge — OPTIONAL observability add-on (Prometheus + Loki + Promtail + Grafana).
# Layer on top of any scenario file, e.g.:
#   docker compose -f compose/compose.prod-cpu.yml -f compose/overlays/compose.telemetry.yml --profile full up -d
#   docker compose -f compose/compose.dev-cpu.yml  -f compose/overlays/compose.telemetry.yml --profile full up -d
#
# WHEN TO USE THIS FILE: you want metrics/log dashboards without standing up your own
# Prometheus/Grafana. NOT baked into any scenario file — opt-in add-on, same pattern as
# overlays/compose.proxy.yml. These 4 services carry NO `profiles:` key (unlike app/worker/frontend/
# mcp, which are gated behind "full") — they start unconditionally whenever this overlay is
# included, so `--profile full` still starts the rest of the stack exactly as before; the
# telemetry containers just come along for free. Config lives under services/telemetry/ (the
# per-service config home, same as services/caddy, services/docforge). Relative paths below
# resolve from the compose/ PROJECT dir (first -f file's dir), NOT this file's dir — an -f
# overlay resolves from the project dir — hence `../services/telemetry/...`.
#
# What this adds:
#   - prometheus: scrapes docforge_app:8000/metrics over the internal docforge_net (NOT
#     the published host port — /metrics is unauthenticated, see docs/configuration.md).
#   - loki + alloy: Grafana Alloy (the successor to Promtail) tails every container's Docker
#     json-file log (via discovery.docker against the read-only docker.sock + /var/lib/docker/
#     containers mounts) and ships it to loki. Config: services/telemetry/alloy/config.alloy.
#   - remote collectors: prometheus runs with --web.enable-remote-write-receiver and loki's push
#     API is open on the internal net, so a REMOTE Alloy on another host can ship its metrics/logs
#     into this stack; dashboards use datasource template variables (DS_PROMETHEUS/DS_LOKI) so an
#     operator can point them at a local or a remote Prometheus/Loki without editing panels.
#   - grafana: provisioned with both datasources + five dashboards
#     (services/telemetry/grafana/dashboards/*.json) — docforge-overview (Control Tower: request
#     rate, p95 latency, error rate, arq queue depth, job counts, live workers), docforge-api
#     (HTTP golden signals + per-route breakdown), docforge-jobs (queue/worker detail),
#     docforge-runtime (process memory/CPU/GC), docforge-logs (Loki volume + live tail).
#
# Grafana admin login: services/telemetry/.env (GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD,
# injected via env_file — the discoverable per-service config home). Copy .env.example → .env and
# CHANGE the password before exposing Grafana beyond localhost/an operator VPN. No plaintext
# secret ships in this file or in git — the tracked .env.example only carries a `change_me_*`
# placeholder, and the real `.env` is gitignored.
#
# Ports (VM firewall range 10000-11000; 10040-10049 already used by the core stack — see
# compose/README.md's port table): grafana 10050, prometheus 10051, loki 10052.
#
# SECURITY: prometheus and loki ship NO authentication of their own (unlike grafana, which at
# least gates on the admin login above) — anyone who can reach the port can read every scraped
# metric or shipped container log line. All three host ports below default-bind to
# 127.0.0.1 (loopback-only), matching this file's own long-standing advice ("keep the telemetry
# stack off any public interface") that the previous unbound `"host:container"` mappings didn't
# actually enforce. Override via `TELEMETRY_BIND_ADDR` (project-root .env) ONLY if you understand
# the exposure — e.g. `TELEMETRY_BIND_ADDR=0.0.0.0` on a host already firewalled at the network
# layer — and prefer routing through `compose/overlays/compose.proxy.yml` or an SSH/VPN tunnel instead of
# widening the bind address.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Prometheus — scrapes DocForge app metrics ───────────────────────────────
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: docforge-prometheus
    # Explicit command so we can enable the remote-write RECEIVER: a REMOTE Grafana Alloy running
    # on another host can `prometheus.remote_write` its metrics INTO this Prometheus (the in-stack
    # scrape config still runs; remote series arrive alongside, distinguished by their own labels).
    # Keep the two default paths the bare image sets, then add the receiver flag.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ../services/telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - docforge_prometheus_data:/prometheus
    ports:
      # Loopback-only by default — prometheus has no auth of its own. See header comment.
      - "${TELEMETRY_BIND_ADDR:-127.0.0.1}:10051:9090" # Operator access: http://localhost:10051
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        # Scraping one app target + its own TSDB — generous headroom without letting a
        # runaway cardinality spike take down the whole overlay.
        limits:
          memory: 512m
    restart: unless-stopped
    networks:
      - docforge_net

  # ── Loki — log storage/index, receives from promtail ────────────────────────
  loki:
    image: grafana/loki:2.9.8
    container_name: docforge-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ../services/telemetry/loki-config.yml:/etc/loki/loki-config.yml:ro
      - docforge_loki_data:/loki
    ports:
      # Loopback-only by default — loki has no auth of its own and holds every container's logs.
      - "${TELEMETRY_BIND_ADDR:-127.0.0.1}:10052:3100" # Operator access / ad-hoc LogQL queries: http://localhost:10052
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        # Log storage/index for the whole stack's container output — bounded so a log flood
        # can't starve the app/worker containers sharing the host.
        limits:
          memory: 1g
    restart: unless-stopped
    networks:
      - docforge_net

  # ── Alloy — collects every container's Docker log and ships it to loki (replaces Promtail) ──
  # Grafana Alloy is the supported successor to Promtail (Promtail is now feature-frozen/EOL). It
  # discovers containers on this host's Docker socket, tails their json-file logs, and writes to
  # loki — same job Promtail did, in Alloy's config language (services/telemetry/alloy/config.alloy).
  alloy:
    image: grafana/alloy:v1.5.1
    container_name: docforge-alloy
    # `run <config>`; `--storage.path` is where Alloy keeps its own WAL/positions (needs a writable
    # volume so log positions survive a restart, like Promtail's positions.yaml did). The HTTP
    # server (health + optional debug UI) binds inside the container only — not published to the host.
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../services/telemetry/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only: Alloy only reads container logs, never writes to the Docker state dir.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # Read-only: needed for discovery.docker container discovery (name/label relabeling) —
      # Alloy never starts/stops/inspects-with-write anything through this socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docforge_alloy_data:/var/lib/alloy/data
    # No container healthcheck: the grafana/alloy image ships no wget/curl, and nothing in this
    # overlay depends_on alloy being *healthy* (grafana waits on prometheus+loki, not alloy). Alloy
    # exposes /-/ready on :12345 for an operator probe; log delivery is verified against Loki instead.
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        # Tails Docker container logs and forwards to loki — light footprint, small on-disk WAL.
        limits:
          memory: 256m
    restart: unless-stopped
    networks:
      - docforge_net

  # ── Grafana — dashboards over Prometheus + Loki, provisioned on boot ────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: docforge-grafana
    # Admin credentials live in services/telemetry/.env (GF_SECURITY_ADMIN_USER / _PASSWORD) —
    # the discoverable per-service config home (like services/caddy, services/docforge). Change
    # them THERE before exposing Grafana beyond localhost/an operator VPN.
    env_file:
      - ../services/telemetry/.env
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../services/telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../services/telemetry/grafana/dashboards:/etc/grafana/dashboards:ro
      - docforge_grafana_data:/var/lib/grafana
    ports:
      # Loopback-only by default too, in spite of grafana's own login gate — defense in depth
      # against the shipped `change_me_grafana_admin` placeholder never getting changed.
      - "${TELEMETRY_BIND_ADDR:-127.0.0.1}:10050:3000" # Grafana UI: http://localhost:10050 (user: admin)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    deploy:
      resources:
        # UI + provisioning engine only — no scrape/ingest load of its own.
        limits:
          memory: 512m
    restart: unless-stopped
    networks:
      - docforge_net

volumes:
  docforge_prometheus_data:
  docforge_loki_data:
  docforge_grafana_data:
  docforge_alloy_data:
