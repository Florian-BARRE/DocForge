# ─────────────────────────────────────────────────────────────────────────────
# DocForge — OPTIONAL TLS reverse-proxy add-on. Layer on top of any scenario file, e.g.:
#   docker compose -f compose/compose.prod-cpu.yml -f compose/overlays/compose.proxy.yml --profile full up -d
#   docker compose -f compose/compose.prod-gpu.yml -f compose/overlays/compose.proxy.yml --profile full up -d
#
# WHEN TO USE THIS FILE: only relevant when DocForge itself must terminate TLS (e.g. a bare
# VM with a public IP and no host/VM-level reverse proxy or corporate load balancer in front
# of it already). If your infrastructure already terminates TLS upstream, do NOT layer this
# file — leave docforge_app on plain HTTP behind that proxy instead. See
# docs/PROD-HARDENING.md's "Optional TLS reverse proxy" section for the full decision.
# NOT baked into any scenario file (compose/prod-*.yml, compose/dev-*.yml) — it is an
# opt-in add-on layered with an extra `-f`, same as overlays/compose.telemetry.yml. As a `-f`-stacked
# add-on (NOT include:-ed), relative bind paths resolve from the PROJECT directory (the first `-f`
# file's dir, i.e. compose/) — hence `../services/...`, exactly like overlays/compose.telemetry.yml. (A
# leading `../../` here would resolve OUTSIDE the repo and Docker would mount an empty auto-created
# dir, silently starting Caddy with no config.)
#
# What this changes vs the base (CPU) prod file:
#   - adds docforge_caddy: Caddy 2, auto-HTTPS (Let's Encrypt) for DOCFORGE_DOMAIN,
#     reverse-proxying to docforge_app and authoritatively setting X-Forwarded-For /
#     X-Forwarded-Proto (the app's rate-limiter keys on X-Forwarded-For — see the Caddyfile)
#   - docforge_app STOPS publishing its own host port (10040): once this overlay is in
#     use, 80/443 on docforge_caddy are the only public entry point, so plaintext API
#     access can't bypass TLS. Internal/operator access still works via
#     `docker compose exec docforge_app ...` or `docker compose port docforge_app 8000`.
#
# Requires DOCFORGE_DOMAIN + DOCFORGE_ACME_EMAIL set in the project-root .env (compose
# interpolation — same mechanism as DOCFORGE_TAG, see .env.example). Let's Encrypt needs
# DOCFORGE_DOMAIN's DNS A/AAAA record pointing at this host and ports 80+443 reachable
# from the internet (HTTP-01 challenge + auto HTTP->HTTPS redirect).
# ─────────────────────────────────────────────────────────────────────────────

services:
  docforge_caddy:
    image: caddy:2.9-alpine
    container_name: docforge-caddy
    # Same "full" profile as its depends_on target docforge_app — otherwise omitting
    # `--profile full` fails the whole project with "depends on undefined service"
    # instead of just skipping the proxy (mirrors docforge_frontend's dev-compose pattern).
    profiles: ["full"]
    environment:
      # ':?' fails `up`/`config` fast with a clear message instead of Caddy erroring on an
      # empty site address once the container is already running.
      DOCFORGE_DOMAIN: ${DOCFORGE_DOMAIN:?set DOCFORGE_DOMAIN in the project-root .env before using compose/overlays/compose.proxy.yml}
      DOCFORGE_ACME_EMAIL: ${DOCFORGE_ACME_EMAIL:?set DOCFORGE_ACME_EMAIL in the project-root .env before using compose/overlays/compose.proxy.yml}
    ports:
      - "80:80"                 # ACME HTTP-01 challenge + HTTP->HTTPS redirect
      - "443:443"                # Public HTTPS (the only public entry point once this overlay is used)
      - "443:443/udp"             # HTTP/3 (QUIC)
    volumes:
      - ../services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persists the ACME account + issued certs across recreations — without this, every
      # `up` re-runs the HTTP-01 challenge and can hit Let's Encrypt's rate limits.
      - docforge_caddy_data:/data
      - docforge_caddy_config:/config
    depends_on:
      docforge_app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - docforge_net

  # Public plaintext access now goes through docforge_caddy (443) instead — see the header
  # comment above for why.
  docforge_app:
    ports: !override []

volumes:
  docforge_caddy_data:
  docforge_caddy_config:
