# ─────────────────────────────────────────────────────────────────────────────
# DocForge — DEV GPU scenario. Same as compose.dev-cpu.yml (local build + source mounts + hot
# reload + Vite frontend), but worker/bge_server/paddle_server build against the GPU torch/
# paddle wheel and are granted the NVIDIA device.
#
# INCLUDE ORDER MATTERS, and is COUNTER-INTUITIVE: compose.gpu.yml FIRST, then compose.dev.yml, then compose.base.yml
# LAST. Verified on this repo's Compose v5.1.1: `include:`'s conflict resolution is
# FIRST-listed-file-wins for any leaf two included files both set — the OPPOSITE of `-f`'s
# last-wins (which is what a plain `-f base -f dev -f gpu` stack correctly does). Concretely:
#   - compose.gpu.yml must precede compose.dev.yml so `build.args.TORCH_VARIANT: gpu` wins over dev's `cpu`,
#     and so `image:` (`-gpu` tag) wins over base's `-cpu` tag.
#   - compose.dev.yml must precede compose.base.yml so dev's source-mount `volumes:` and host-cache bind win
#     over base's named-volume defaults.
#   - compose.gpu.yml's `build.context`/`dockerfile` are spelled out explicitly (matching compose.dev.yml's
#     values) specifically so it doesn't matter that compose.gpu.yml "wins" that leaf too — both files
#     agree. See compose/overlays/compose.gpu.yml's header comment for the full explanation, the
#     reproduction that uncovered this, and why compose.proxy.yml/compose.telemetry.yml (always `-f`-layered,
#     never `include:`d) are unaffected.
#
# WHEN TO USE THIS FILE: local development on a GPU-equipped machine.
#
#   docker compose -f compose/compose.dev-gpu.yml --profile full up -d --build
#
# Add-ons (layer with an extra -f, never baked in here):
#   docker compose -f compose/compose.dev-gpu.yml -f compose/overlays/compose.telemetry.yml --profile full up -d --build
# ─────────────────────────────────────────────────────────────────────────────

name: docforge

include:
  - overlays/compose.gpu.yml
  - overlays/compose.dev.yml
  - compose.base.yml
