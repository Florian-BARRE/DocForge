# ─────────────────────────────────────────────────────────────────────────────
# DocForge — development overrides. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile full up -d --build
#   GPU dev:  append  -f docker-compose.gpu.yml  LAST (compose is last-file-wins, so it must
#             follow this file to override TORCH_VARIANT=cpu → gpu + grant the device):
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.gpu.yml ... up -d --build
#
# What this changes vs production:
#   - app/worker/mcp/bge_server BUILD locally from source (each `build:` here overrides the
#     prod GHCR `image:` pull in the base file), so `--build` compiles the current tree
#   - app + worker mount the SOURCE tree, so edits reload without rebuilding
#   - uvicorn runs with --reload; arq runs with --watch (watchfiles ships via uvicorn[standard])
#   - the frontend runs as its OWN container on the Vite dev server (hot module reload),
#     proxying /api to the app service; the app still serves the last built dist/ too
#   - the worker reuses the HOST's HuggingFace cache so docling never re-downloads models
#   - the data-plane stores (postgres/redis/qdrant/seaweedfs/bge_server) republish their host
#     ports — the prod compose keeps them internal to docforge_net only (operator access via
#     `docker compose exec`); dev needs them for local psql/redis-cli/alembic/browser access
# ─────────────────────────────────────────────────────────────────────────────

services:
  docforge_app:
    # Build locally from source, overriding the prod GHCR image: pull in the base file.
    build:
      context: src/docforge
      dockerfile: app/Dockerfile
    volumes:
      # Source overlays — edits on the host are live inside the container.
      - ./src/docforge/app:/app/app
      - ./src/docforge/shared:/app/shared
    environment:
      DEV_MODE: "true"
    command: >
      uvicorn entrypoint:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
      --reload-dir /app/shared

  docforge_worker:
    # Build locally from source, overriding the prod GHCR image: pull in the base file.
    # CPU torch by default; the gpu override file flips TORCH_VARIANT to gpu.
    build:
      context: src/docforge
      dockerfile: worker/Dockerfile
      args:
        TORCH_VARIANT: cpu
    volumes:
      - ./src/docforge/worker:/app/worker
      - ./src/docforge/shared:/app/shared
      # Reuse the host's HF cache so docling never re-downloads models.
      # ${HOME} on Linux; on Windows/Docker Desktop export HOME or swap for ${USERPROFILE}.
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    environment:
      DEV_MODE: "true"
    # Hot-reload the arq worker on source edits. arq's own --watch only recreates the asyncio
    # Worker with ALREADY-imported (stale) modules, so code changes never take effect. Wrapping the
    # whole process in `watchfiles` (a base dep via fastapi[standard]) does a real kill+restart that
    # re-imports everything. Watch the mounted source roots only.
    command: ["watchfiles", "arq entrypoint.WorkerSettings", "/app/shared", "/app/worker"]

  # ── mcp — build locally from source (override the prod GHCR image: pull). No source
  #    mounts: no hot-reload command, so a rebuild (`--build`) picks up its source changes.
  #    (bge_server's build override lives on its own block below, alongside its port republish.) ──
  docforge_mcp:
    build:
      context: src                # sibling context: the mcp source is src/mcp, not under docforge
      dockerfile: mcp/Dockerfile

  # ── Data-plane stores — republish host ports for local dev (psql/redis-cli/alembic/
  #    browser access to Qdrant's/SeaweedFS's REST APIs). Prod keeps these internal only. ──
  docforge_postgres:
    ports:
      - "10041:5432"              # Operator/local-dev access (alembic, psql)

  docforge_redis:
    ports:
      - "10042:6379"              # Local-dev access (app enqueue / worker listen)

  docforge_qdrant:
    ports:
      - "10043:6333"              # REST API (local dev + operator inspection)

  docforge_seaweedfs:
    ports:
      - "10044:8333"              # S3 API (local dev + operator inspection)

  docforge_bge_server:
    # Build locally from source, overriding the prod GHCR image: pull in the base file.
    # CPU torch by default; the gpu override file flips TORCH_VARIANT to gpu.
    build:
      context: src                # bge_server lives at src/bge_server (sibling of docforge)
      dockerfile: bge_server/Dockerfile
      args:
        TORCH_VARIANT: cpu
    ports:
      - "10047:80"                # Operator access: http://localhost:10047/health

  docforge_paddle_server:
    # Build locally from source, overriding the prod GHCR image: pull in the base file.
    # CPU paddlepaddle by default; the gpu override file flips TORCH_VARIANT to gpu.
    build:
      context: src                # paddle_server lives at src/paddle_server (sibling of docforge)
      dockerfile: paddle_server/Dockerfile
      args:
        TORCH_VARIANT: cpu
    ports:
      - "10049:80"                # Operator access: http://localhost:10049/health

  # ── Vite dev server — hot-reloading frontend, dev-only service ───────────────
  docforge_frontend:
    image: node:22-bookworm-slim
    container_name: docforge-frontend
    # Same "full" profile as its depends_on target docforge_app — otherwise the frontend sits in the
    # default profile while docforge_app does not, and compose rejects the project with
    # "docforge_frontend depends on undefined service docforge_app". Everything comes up together under
    # `--profile full` (see the dev command below).
    profiles: ["full"]
    # Same reason as docforge_app/docforge_worker in the base compose: Docker's embedded
    # resolver has no external upstream on this VM, so without a pin `npm install`
    # cannot resolve registry.npmjs.org (only masked when the node_modules volume is
    # already populated from a previous run).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    working_dir: /frontend
    volumes:
      - ./src/docforge/app/frontend:/frontend
      # node_modules stays container-side: the host's Windows-built tree must never leak in.
      - docforge_frontend_modules:/frontend/node_modules
    environment:
      # The proxy target is the app SERVICE, not localhost (see vite.config.ts).
      VITE_API_PROXY_TARGET: http://docforge_app:8000
      # File-change events do NOT propagate through the Windows bind mount — poll instead,
      # otherwise Vite serves its startup snapshot forever (no HMR, stale modules).
      CHOKIDAR_USEPOLLING: "true"
    # `npm ci` only when the node_modules volume is cold (first run) — otherwise re-resolving the
    # whole tree on every `up` burns network + CPU for nothing. `ci` (not `install`) = reproducible
    # from the lockfile.
    command: sh -c "[ -x node_modules/.bin/vite ] || npm ci; npm run dev"
    ports:
      - "10046:5173"              # Vite dev UI (hot reload)
    depends_on:
      - docforge_app
    restart: unless-stopped
    networks:
      - docforge_net

volumes:
  docforge_frontend_modules:
