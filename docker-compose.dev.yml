# DocForge — development overrides (Docker Compose v2).
# Use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
#
# What this file changes vs production:
# - All app source is volume-mounted → code edits are reflected without rebuild.
# - EVERY service hot-reloads on change:
#     · docforge   → uvicorn --reload (watches /app/backend + /app/common)
#     · frontend   → Vite dev server + HMR on :10023 (separate dev-only service)
#     · worker     → arq --watch /app (restarts WorkerSettings on change)
#     · mcp        → watchfiles wraps `python entrypoint.py` (restart; boots <1s)
#     · bge_server → uvicorn --reload (NOTE: a reload RE-LOADS ~4.4 GiB of models, slow on CPU)
#   watchfiles ships with uvicorn[standard], already present in every image — no extra deps.
#   Polling is forced (WATCHFILES_FORCE_POLLING) because WSL2 inotify on Windows bind mounts
#   is unreliable and otherwise misses (or storms) on edits.
# - FASTAPI_DEBUG_MODE=true → 500 responses include full tracebacks (never in prod).
# - DEV_MODE=true → enables the early debug logger in runtime_config.py.
# - PostgreSQL port is published for direct DB inspection during development.

services:

  docforge:
    # Rebuild the image on dev start to ensure dependencies are up to date.
    # The volume mounts below overlay the source with the local working tree.
    build:
      context: src
      dockerfile: docforge/app/Dockerfile
    volumes:
      # Mount the shared + backend source trees over the container copies.
      # Edits are reflected immediately; only dependency changes require a rebuild.
      - ./src/docforge/common:/app/common
      - ./src/docforge/app:/app/backend
    environment:
      - FASTAPI_DEBUG_MODE=true
      - DEV_MODE=true
#      - LOGGING_CONSOLE_LEVEL=DEBUG
#      - LOGGING_LPP_FORMAT=DebugFormat
      # Resolve `config` + `common_libs.*` (from /app/common) and `backend`/`libs.*`
      # (from /app/backend). entrypoint.py's bootstrap also adds these, but setting
      # PYTHONPATH keeps imports robust under the volume-mounted dev tree.
      - PYTHONPATH=/app/common:/app/backend
      # On Windows + Docker Desktop, inotify events from the WSL2 volume mount are
      # unreliable and can trigger an infinite reload loop.  Polling is slower but
      # stable — WatchFiles checks for changes every ~1.6 s instead of reacting to events.
      - WATCHFILES_FORCE_POLLING=true
    command: >
      uvicorn entrypoint:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/backend
      --reload-dir /app/common

  # Vite development server for the React frontend.
  # Serves the frontend on :5173 (mapped to host :10023) with HMR (hot module replacement).
  # The /api proxy forwards all API calls to the FastAPI backend on :8000.
  frontend:
    image: node:22-bookworm-slim
    container_name: dev-docforge-app-frontend  # dev- prefix marks this as the Vite dev server, not a prod container
    working_dir: /app
    volumes:
      # Mount the frontend source directly for instant HMR on file save.
      - ./src/docforge/app/frontend:/app
      # Container-private node_modules: the host node_modules is installed on Windows and
      # ships the win32 rollup/esbuild native binaries, which crash inside this Linux
      # container ("Cannot find module '@rollup/rollup-linux-x64-gnu'"). This named volume
      # shadows the host node_modules so the container installs its own Linux binaries and
      # the two never collide. Persisted across recreates so npm install runs only once.
      - frontend_node_modules:/app/node_modules
    ports:
      - "10023:5173"          # Vite dev server (HMR) — firewall: only 10000-11000 open
    environment:
      # Point Vite's /api proxy to the backend container name (not localhost,
      # which would resolve to the frontend container itself inside the network).
      - VITE_PROXY_TARGET=http://docforge:8000
    # Vite dev server (Node) — light; cap at 1 GiB / 1 CPU to stay sober in dev.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    networks:
      - docforge_net
    # Run Vite dev server listening on all interfaces (required inside container).
    # Only run npm install when node_modules is missing — avoids network round-trips
    # on every restart when dependencies are already installed.
    command: ["/bin/sh", "-c", "[ -x node_modules/.bin/vite ] || npm install; npm run dev -- --host"]
    depends_on:
      - docforge

  postgres:
    ports:
      # Publish Postgres port for direct inspection via psql or DB GUI tools.
      - "10024:5432"          # Postgres dev access — firewall: only 10000-11000 open

  worker:
    # Volume-mount the shared + worker source so code changes are picked up without rebuilding.
    volumes:
      - ./src/docforge/common:/app/common
      - ./src/docforge/worker:/app/worker
    environment:
      - DEV_MODE=true
#      - LOGGING_CONSOLE_LEVEL=DEBUG
#      - LOGGING_LPP_FORMAT=DebugFormat
      - PYTHONPATH=/app/common:/app/worker
      # Forced polling — WSL2 inotify on Windows bind mounts is unreliable for the watcher below.
      - WATCHFILES_FORCE_POLLING=true
    # Hot reload: arq's built-in --watch restarts the worker on any change under /app
    # (covers both the mounted common/ and worker/ trees). watchfiles ships with uvicorn[standard].
    command: arq entrypoint.WorkerSettings --watch /app

  mcp:
    # Volume-mount source so tool/SDK edits are picked up live (hot-reloaded below).
    volumes:
      - ./src/mcp:/app/mcp
    environment:
      # Override the transport here if you want to exercise stdio locally instead of HTTP.
      - MCP_TRANSPORT=streamable-http
      - LOGGING_CONSOLE_LEVEL=DEBUG
      # Forced polling — WSL2 inotify on Windows bind mounts is unreliable for the watcher below.
      - WATCHFILES_FORCE_POLLING=true
    # Hot reload: the watchfiles CLI (ships with uvicorn[standard]) restarts
    # `python entrypoint.py` on any change under /app/mcp. The server boots in <1s.
    command: watchfiles "python entrypoint.py" /app/mcp

  bge_server:
    # Volume-mount the application source tree so code edits are picked up live.
    # The container WORKDIR is /app/bge_server; we mount the host bge_server folder
    # over that path (the venv lives at /opt/venv and is untouched by the mount).
    volumes:
      - ./src/bge_server:/app/bge_server
    environment:
      - DEV_MODE=true
      # Forced polling — WSL2 inotify on Windows bind mounts is unreliable for the watcher below.
      - WATCHFILES_FORCE_POLLING=true
    # Hot reload via uvicorn --reload. NOTE: a reload re-runs the FastAPI lifespan, which
    # RE-LOADS both BGE models (~4.4 GiB, slow on CPU). The source rarely changes, so this
    # is acceptable; comment the command out to fall back to the image CMD if you want to avoid
    # the model reload during a dev session.
    command: uvicorn entrypoint:app --host 0.0.0.0 --port 80 --reload --reload-dir /app/bge_server

# Dev-only named volumes.
volumes:
  # Container-private node_modules for the Vite dev server (see the frontend service).
  frontend_node_modules:
