# DocForge — development overrides (Docker Compose v2).
# Use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
#
# What this file changes vs production:
# - DocForge source is volume-mounted → code edits are reflected without rebuild.
# - uvicorn runs with --reload, watching /app/docforge for changes.
# - Vite dev server runs as a separate service with HMR on :10023.
# - FASTAPI_DEBUG_MODE=true → 500 responses include full tracebacks (never in prod).
# - DEV_MODE=true → enables the early debug logger in runtime_config.py.
# - PostgreSQL port is published for direct DB inspection during development.

services:

  docforge:
    # Rebuild the image on dev start to ensure dependencies are up to date.
    # The volume mounts below overlay the source with the local working tree.
    build:
      context: src
      dockerfile: docforge/app/Dockerfile
    volumes:
      # Mount the shared + backend source trees over the container copies.
      # Edits are reflected immediately; only dependency changes require a rebuild.
      - ./src/docforge/common:/app/common
      - ./src/docforge/app:/app/backend
    environment:
      - FASTAPI_DEBUG_MODE=true
      - DEV_MODE=true
#      - LOGGING_CONSOLE_LEVEL=DEBUG
#      - LOGGING_LPP_FORMAT=DebugFormat
      # Resolve `config` + `common_libs.*` (from /app/common) and `backend`/`libs.*`
      # (from /app/backend). entrypoint.py's bootstrap also adds these, but setting
      # PYTHONPATH keeps imports robust under the volume-mounted dev tree.
      - PYTHONPATH=/app/common:/app/backend
      # On Windows + Docker Desktop, inotify events from the WSL2 volume mount are
      # unreliable and can trigger an infinite reload loop.  Polling is slower but
      # stable — WatchFiles checks for changes every ~1.6 s instead of reacting to events.
      - WATCHFILES_FORCE_POLLING=true
    command: >
      uvicorn entrypoint:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/backend
      --reload-dir /app/common

  # Vite development server for the React frontend.
  # Serves the frontend on :5173 (mapped to host :10023) with HMR (hot module replacement).
  # The /api proxy forwards all API calls to the FastAPI backend on :8000.
  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      # Mount the frontend source directly for instant HMR on file save.
      - ./src/docforge/app/frontend:/app
    ports:
      - "10023:5173"          # Vite dev server (HMR) — firewall: only 10000-11000 open
    environment:
      # Point Vite's /api proxy to the backend container name (not localhost,
      # which would resolve to the frontend container itself inside the network).
      - VITE_PROXY_TARGET=http://docforge:8000
    # Vite dev server (Node) — light; cap at 1 GiB / 1 CPU to stay sober in dev.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    networks:
      - docforge_net
    # Run Vite dev server listening on all interfaces (required inside container).
    # Only run npm install when node_modules is missing — avoids network round-trips
    # on every restart when dependencies are already installed.
    command: ["/bin/sh", "-c", "[ -d node_modules ] || npm install && npm run dev -- --host"]
    depends_on:
      - docforge

  postgres:
    ports:
      # Publish Postgres port for direct inspection via psql or DB GUI tools.
      - "10024:5432"          # Postgres dev access — firewall: only 10000-11000 open

  worker:
    # Volume-mount the shared + worker source so code changes are picked up without rebuilding.
    volumes:
      - ./src/docforge/common:/app/common
      - ./src/docforge/worker:/app/worker
    environment:
      - DEV_MODE=true
#      - LOGGING_CONSOLE_LEVEL=DEBUG
#      - LOGGING_LPP_FORMAT=DebugFormat
      - PYTHONPATH=/app/common:/app/worker

  reranker:
    # Expose the reranker port for operator inspection and local testing during development.
    ports:
      - "10027:80"          # TEI reranker dev access: http://localhost:10027/health

  mcp:
    # Volume-mount source so tool/SDK edits are picked up on container restart.
    # The MCP server has no hot-reload of its own; restart the container after edits
    # (docker compose restart mcp) — it boots in well under a second.
    volumes:
      - ./src/mcp:/app/docforge_mcp
    environment:
      # Override the transport here if you want to exercise stdio locally instead of HTTP.
      - MCP_TRANSPORT=streamable-http
      - LOGGING_CONSOLE_LEVEL=DEBUG
